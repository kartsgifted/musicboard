<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K예술영재 프로젝트 음악분야 멘토링 게시판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<style>
  /* 페이퍼로지: 설치된 글꼴이 있으면 먼저 쓰고, 없으면 웹폰트로 불러옴 */
  @font-face { font-family: 'Paperlogy'; font-weight: 500; font-display: swap;
    src: local('페이퍼로지 5 Medium'), local('Paperlogy-5Medium'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Paperlogy'; font-weight: 600; font-display: swap;
    src: local('페이퍼로지 6 SemiBold'), local('Paperlogy-6SemiBold'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Paperlogy'; font-weight: 700; font-display: swap;
    src: local('페이퍼로지 7 Bold'), local('Paperlogy-7Bold'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Paperlogy'; font-weight: 800; font-display: swap;
    src: local('페이퍼로지 8 ExtraBold'), local('Paperlogy-8ExtraBold'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2'); }

  :root {
    --teal: #176C86;        /* 주조색 */
    --teal-deep: #1C6077;   /* 딥 청록 */
    --ivory: #FAF9F5;       /* 배경 */
    --ink: #212326;         /* 글자 먹색 */
    --coral: #E84958;       /* 좁은 면적 강조 */
    --apricot: #FFB098;     /* 넓은 면적·배지 배경 (글자색 사용 금지) */
    --muted: #62686D;
    --line: #E3E1D9;
    --surface: #FFFFFF;
    --teal-soft: #E6F0F3;
    --sans: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --head: 'Paperlogy', 'Pretendard', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ivory); color: var(--ink);
    font-family: var(--sans); font-size: 18px; line-height: 1.65;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
  main.wrap { padding-bottom: 80px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; min-height: 44px; }
  .count { color: var(--muted); font-size: 15px; }
  .count b { color: var(--ink); }

  .btn {
    border: 1px solid var(--line); background: var(--surface);
    padding: 9px 18px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 500;
  }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-family: var(--head); font-weight: 600; }
  .btn.primary:hover { background: var(--teal-deep); color: #fff; }
  .btn.danger:hover, .btn.danger { color: var(--coral); }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .link.danger:hover { color: var(--coral); }

  /* 목록: 카드 대신 줄 단위 목록, 상단 굵은 선으로 시작 */
  ul.list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  ul.list li { border-bottom: 1px solid var(--line); }
  ul.list button {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 20px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: 0; padding: 22px 4px; cursor: pointer;
  }
  ul.list button:hover { background: var(--surface); }
  ul.list button:hover .t { color: var(--teal); }
  .t { font-family: var(--head); font-size: 19px; font-weight: 600; line-height: 1.45; }
  .meta { color: var(--muted); font-size: 15px; }
  .cc { color: var(--coral); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .pin {
    display: inline-block; background: var(--apricot); color: var(--ink);
    font-size: 13px; font-weight: 700; padding: 1px 9px; border-radius: 2px; margin-right: 10px; vertical-align: 2px;
  }
  .empty { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); padding: 64px 20px; text-align: center; color: var(--muted); }

  /* 상세 */
  article { border-top: 2px solid var(--ink); padding: 32px 4px 8px; }
  article h2 { margin: 0 0 8px; font-family: var(--head); font-size: clamp(22px, 4vw, 28px); line-height: 1.4; }
  article .body { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); }
  article .body.plain { white-space: pre-wrap; }

  /* 서식 본문 (보기 화면과 편집 화면 공통) */
  .rich > :first-child { margin-top: 0; }
  .rich p { margin: 0; }
  .rich p:empty::after { content: '\00a0'; }
  .rich h2 { font-family: var(--head); font-weight: 700; font-size: 1.4em; line-height: 1.4; margin: 1.2em 0 .4em; }
  .rich h3 { font-family: var(--head); font-weight: 700; font-size: 1.15em; line-height: 1.45; margin: 1em 0 .3em; color: var(--teal-deep); }
  .rich ul, .rich ol { margin: .4em 0; padding-left: 1.6em; }
  .rich li { margin: .15em 0; }
  .rich blockquote { margin: .8em 0; padding: .4em 0 .4em 1em; border-left: 4px solid var(--teal); background: var(--teal-soft); }
  .rich a { color: var(--teal); text-underline-offset: 3px; }
  .rich strong { font-weight: 700; }
  .rich .ql-align-center { text-align: center; }
  .rich .ql-align-right { text-align: right; }
  .rich .ql-align-justify { text-align: justify; }
  .rich .ql-size-small { font-size: .85em; }
  .rich .ql-size-large { font-size: 1.3em; }
  .rich .ql-indent-1 { padding-left: 2em; } .rich .ql-indent-2 { padding-left: 4em; } .rich .ql-indent-3 { padding-left: 6em; }
  .rich li.ql-indent-1 { margin-left: 2em; padding-left: 0; } .rich li.ql-indent-2 { margin-left: 4em; padding-left: 0; }

  /* 편집기 (Quill) 모양을 게시판에 맞춤 */
  /* Quill 기본값(height:100%)이 도구 막대 높이만큼 아래로 넘쳐 첨부 영역을 덮는 문제 수정 */
  .rich-wrap { display: flex; flex-direction: column; min-width: 0; }
  .rich-wrap .ql-container { height: auto !important; }
  .rich-wrap .ql-editor { height: auto !important; overflow-y: visible; }
  .rich-wrap .ql-toolbar.ql-snow { border: 1px solid var(--line); border-radius: 4px 4px 0 0; background: var(--ivory); font-family: var(--sans); padding: 6px 8px; }
  .rich-wrap .ql-container.ql-snow { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 4px 4px; background: #fff; font-family: var(--sans); font-size: 17px; }
  .rich-wrap .ql-editor { min-height: 340px; max-height: none; line-height: 1.65; padding: 16px 18px; word-break: keep-all; }
  .rich-wrap .ql-editor.ql-blank::before { font-style: normal; color: #9AA0A4; left: 18px; }
  .rich-wrap .ql-snow .ql-stroke { stroke: var(--ink); }
  .rich-wrap .ql-snow .ql-fill { fill: var(--ink); }
  .rich-wrap .ql-snow button:hover .ql-stroke, .rich-wrap .ql-snow button.ql-active .ql-stroke,
  .rich-wrap .ql-snow .ql-picker-label:hover .ql-stroke, .rich-wrap .ql-snow .ql-picker-label.ql-active .ql-stroke { stroke: var(--teal); }
  .rich-wrap .ql-snow button:hover .ql-fill, .rich-wrap .ql-snow button.ql-active .ql-fill { fill: var(--teal); }
  .rich-wrap .ql-snow.ql-toolbar button.ql-active, .rich-wrap .ql-snow .ql-picker-label.ql-active { color: var(--teal); }
  .rich-wrap .ql-snow .ql-picker { color: var(--ink); }
  .rich-wrap .ql-snow .ql-picker.ql-header { width: 96px; }
  .rich-wrap .ql-snow .ql-picker.ql-size { width: 72px; }
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-label::before,
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-item::before { content: '본문'; }
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="2"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="2"]::before { content: '큰 제목'; }
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="3"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="3"]::before { content: '작은 제목'; }
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-label::before,
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-item::before { content: '보통'; }
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="small"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="small"]::before { content: '작게'; }
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="large"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="large"]::before { content: '크게'; }
  .rich-wrap .ql-snow .ql-tooltip { font-family: var(--sans); z-index: 5; }
  .rich-wrap .ql-snow .ql-tooltip::before { content: '링크 주소:'; }
  .rich-wrap .ql-snow .ql-tooltip[data-mode=link]::before { content: '링크 주소 입력:'; }
  .rich-wrap .ql-snow .ql-tooltip a.ql-action::after { content: '수정'; }
  .rich-wrap .ql-snow .ql-tooltip a.ql-remove::before { content: '제거'; }
  .rich-wrap .ql-snow .ql-tooltip.ql-editing a.ql-action::after { content: '저장'; }
  .rich-wrap .ql-snow .ql-editor h2 { font-size: 1.4em; }
  .rich-wrap .ql-snow .ql-editor h3 { font-size: 1.15em; }
  .admin-actions { display: flex; gap: 8px; margin-top: 28px; }

  section.comments { margin-top: 48px; background: var(--surface); border-radius: 6px; padding: 28px 28px 24px; }
  section.comments h3 { font-family: var(--head); font-size: 18px; margin: 0 0 8px; }
  section.comments h3 span { color: var(--coral); }
  .c { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .c-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .c-name { font-weight: 700; }
  .c-body { white-space: pre-wrap; margin-top: 4px; font-size: 17px; }
  .c-head .link { margin-left: auto; }

  form.cform { margin-top: 24px; display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; min-width: 0; }
  input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 11px 14px; background: var(--ivory); font-size: 16px; }
  input::placeholder, textarea::placeholder { color: #9AA0A4; font-weight: 400; }
  input:focus, textarea:focus { background: #fff; border-color: var(--teal); outline: none; }
  textarea { resize: vertical; min-height: 96px; }
  .hint { font-size: 14px; color: var(--muted); }
  .form-end { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* 글쓰기 */
  .editor { border-top: 2px solid var(--ink); padding-top: 24px; display: grid; gap: 14px; }
  .editor input, .editor textarea { background: #fff; }
  .editor textarea { min-height: 340px; }
  label.check { display: flex; gap: 8px; align-items: center; font-size: 16px; }
  label.check input { width: auto; accent-color: var(--teal); }

  /* 첨부: 상세 화면 */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 28px; }
  .gallery.single { grid-template-columns: 1fr; }
  .gallery a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .gallery img { display: block; width: 100%; height: 100%; max-height: 640px; object-fit: contain; background: #fff; }
  .gallery:not(.single) img { aspect-ratio: 4 / 3; object-fit: cover; }
  .files { list-style: none; margin: 28px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .files li { border-bottom: 1px solid var(--line); }
  .files a { display: flex; gap: 12px; align-items: baseline; padding: 12px 4px; color: var(--ink); text-decoration: none; }
  .files a:hover .fname { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
  .fname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .fsize { margin-left: auto; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .ftag { font-family: var(--head); font-size: 12px; font-weight: 700; color: var(--teal); border: 1px solid var(--teal); border-radius: 2px; padding: 0 6px; white-space: nowrap; }
  .clip { color: var(--muted); font-size: 14px; font-weight: 500; margin-left: 8px; font-family: var(--sans); }

  /* 첨부: 글쓰기 화면 */
  .drop {
    border: 1.5px dashed var(--line); border-radius: 4px; background: #fff;
    padding: 20px; text-align: center; color: var(--muted); font-size: 15px; cursor: pointer;
  }
  .drop.over { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
  .drop b { color: var(--teal); }
  .att-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .att-list li { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font-size: 15px; }
  .att-list .thumb { width: 44px; height: 44px; flex: none; border-radius: 2px; object-fit: cover; background: var(--ivory); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
  .att-list .fname { flex: 1; font-weight: 500; }
  .att-list .state { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .att-list .state.err { color: var(--coral); }

  footer.site { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }

  dialog { border: 0; border-top: 4px solid var(--teal); border-radius: 4px; padding: 28px; width: min(380px, 90vw); }
  dialog::backdrop { background: rgba(33, 35, 38, .5); }
  dialog h3 { margin: 0 0 16px; font-family: var(--head); }
  dialog .form-end { margin-top: 16px; justify-content: flex-end; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 4px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--coral); }
  .loading { color: var(--muted); padding: 48px 0; text-align: center; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    header.board { padding: 52px 0 40px; margin-bottom: 32px; --staff-gap: 9px; }
    header.board::before { top: calc(52px + 1px); }
    ul.list button { grid-template-columns: 1fr; padding: 18px 2px; }
    .t { font-size: 17px; }
    section.comments { padding: 22px 18px; margin-left: -8px; margin-right: -8px; }
    .row { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  /* ───────── 4악장 시즌 레이아웃 ───────── */
  .hero { background: var(--teal-deep); color: #fff; padding: 56px 0 0; position: relative; }
  .hero::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 6px;
    background: linear-gradient(to right, var(--coral) 0 96px, var(--teal) 96px); }
  .hero .en { margin: 0; font-family: var(--head); font-weight: 800; font-size: clamp(34px, 7vw, 56px); line-height: 1.05; letter-spacing: -0.01em; }
  .hero .en span { font-weight: 500; opacity: .55; }
  .hero h1 { margin: 16px 0 0; font-family: var(--head); font-weight: 700; font-size: clamp(20px, 3.6vw, 26px); line-height: 1.4; }
  .hero .lede { margin: 8px 0 0; font-size: 16px; opacity: .8; }
  .preview-flag { display: inline-block; margin-top: 12px; background: var(--apricot); color: var(--ink); font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 2px; }

  /* 오선 일정표: 월 = 마디, 음표 = 일정, 막대 = 신청 기간, 재생선 = 오늘 */
  .score-scroll { overflow-x: auto; margin-top: 28px; padding-bottom: 22px; scrollbar-width: thin; }
  .score { --g: 18px; position: relative; min-width: 720px; max-width: 1040px; margin: 0 auto; height: calc(var(--g) * 4 + 122px); padding: 0 40px; }
  .score .staff { position: absolute; left: 40px; right: 40px; top: 70px; height: calc(var(--g) * 4 + 1px);
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.28) 0 1px, transparent 1px var(--g)); }
  .score .track { position: absolute; left: 40px; right: 40px; top: 70px; height: calc(var(--g) * 4); }
  .bar { position: absolute; top: 0; height: calc(var(--g) * 4 + 1px); width: 1px; background: rgba(255,255,255,.45); }
  .bar.final { width: 4px; box-shadow: -5px 0 0 -3px rgba(255,255,255,.45); transform: translateX(-4px); background: rgba(255,255,255,.7); }
  .month { position: absolute; top: -24px; font-family: var(--head); font-size: 13px; font-weight: 600; opacity: .7; white-space: nowrap; transform: translateX(8px); }
  .note { position: absolute; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.9); background: transparent;
    border-radius: 50%; width: 13px; height: 11px; padding: 0; cursor: pointer; color: #fff; }
  .note.past { background: rgba(255,255,255,.9); }
  .note.event { width: 28px; height: 22px; font-family: var(--head); font-weight: 700; font-size: 11px; line-height: 18px; text-align: center; }
  .note.event::after { content: ''; position: absolute; right: -2px; bottom: 50%; width: 2px; height: 34px; background: currentColor; opacity: .9; }
  .note.event.past { color: var(--teal-deep); }
  .note.event.past::after { background: #fff; }
  .note.sel { border-color: var(--apricot); }
  .note.sel.past, .note.event.sel { background: var(--apricot); color: var(--ink); }
  .note.event.sel::after { background: var(--apricot); }
  .note:hover { transform: translate(-50%, -50%) scale(1.15); }
  /* 마우스를 올리면 날짜 말풍선 (::after는 음표 기둥에 쓰므로 ::before 사용) */
  .note::before, .tie::before {
    content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
    background: #fff; color: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 600; line-height: 1.35;
    padding: 6px 10px; border-radius: 4px; white-space: pre; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.25);
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .12s; z-index: 5;
  }
  .note:hover::before, .note:focus-visible::before, .tie:hover::before, .tie:focus-visible::before { opacity: 1; visibility: visible; }
  .note:hover, .note:focus-visible, .tie:hover, .tie:focus-visible { z-index: 6; }
  .note.event::before { bottom: auto; top: calc(100% + 8px); } /* 기둥이 위로 있으니 아래로 */
  .tie:hover { background: rgba(255,255,255,.75); }
  .tie.sel:hover { background: var(--apricot); }
  .tie::after { content: ''; position: absolute; left: 0; right: 0; top: -8px; bottom: -8px; } /* 막대를 가리키기 쉽게 */
  .tie { position: absolute; height: 6px; border-radius: 3px; background: rgba(255,255,255,.4); transform: translateY(-50%); cursor: pointer; border: 0; padding: 0; }
  .tie.sel { background: var(--apricot); }
  .dlabel { position: absolute; top: calc(var(--g) * 4 + 12px); transform: translateX(-50%); font-size: 12px; opacity: .8; white-space: nowrap; }
  .dlabel.row2 { top: calc(var(--g) * 4 + 30px); }
  .dlabel.ev { opacity: 1; font-weight: 700; }
  .playhead { position: absolute; top: -40px; height: calc(var(--g) * 4 + 48px); width: 2px; background: var(--coral); transform: translateX(-1px); pointer-events: none; }
  .playhead span { position: absolute; top: 0; left: 50%; transform: translate(-50%, -100%); background: var(--coral); color: #fff;
    font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 2px; white-space: nowrap; }

<script>
  // ▼ Apps Script 웹 앱 배포 URL (/exec 로 끝나는 주소)
  const API_URL = 'https://script.google.com/macros/s/AKfycbyKy7L_gF2zx7aDG-lTjzyWQFxlenM27x0YPEGRskSGUyyPiubeagrzNB8Pjp2saVee4g/exec';

  // 관리자 토큰은 메모리에만 보관 → 새로고침하면 다시 로그인
  let adminToken = null;
  let current = { view: 'home', postId: null };

  const $ = (s) => document.querySelector(s);
  const view = $('#view');

  // text/plain으로 보내야 CORS 사전 요청(preflight) 없이 Apps Script에 전달됩니다
  async function api(action, ...args) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, args }),
      });
    } catch (e) {
      throw new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');
    }
    let json;
    try { json = await res.json(); }
    catch (e) { throw new Error('서버 응답을 읽을 수 없습니다. 배포 설정(액세스: 모든 사용자)을 확인해 주세요.'); }
    if (!json.ok) throw new Error(json.error || '요청을 처리하지 못했습니다.');
    return json.data;
  }

  function el(tag, props = {}, ...children) {
    const n = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else if (v !== false && v != null) n.setAttribute(k, v);
    });
    children.flat().forEach((c) => c != null && n.append(c.nodeType ? c : document.createTextNode(c)));
    return n;
  }

  let toastTimer;
  function toast(msg, isErr) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = 'toast'), 2600);
  }

  function fmt(s) { return s ? s.slice(0, 16).replace(/-/g, '.') : ''; }

  function handleErr(e) {
    toast(e.message, true);
    if (/로그인이 만료/.test(e.message)) setAdmin(null);
  }

  function setAdmin(token) {
    adminToken = token;
    $('#adminToggle').hidden = !token;
    render();
  }

  /* ───── 시즌 데이터 · 날짜 ───── */
  const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const PREVIEW = (new URLSearchParams(location.search).get('today') || '').match(/^\d{4}-\d{2}-\d{2}$/)
    ? new URLSearchParams(location.search).get('today') : null;
  let board = null;           // { today, sessions, posts }
  let selectedNo = null;
  let newsFilter = 'all';

  const dnum = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
  const daysBetween = (a, b) => Math.round((dnum(b) - dnum(a)) / 86400000);
  const md = (d) => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : '';
  const mdw = (d) => d ? `${md(d)}(${WEEK[new Date(dnum(d)).getUTCDay()]})` : '';
  const dots = (d) => d ? `${+d.slice(5, 7)}.${+d.slice(8, 10)}` : '';
  const today = () => PREVIEW || (board && board.today) || new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  // 받침 유무에 따라 조사 선택 (예: 멘토링이 / 마스터클래스가)
  const josa = (w, a, b) => { const c = (w || '').trim().slice(-1).charCodeAt(0) - 0xAC00; return c >= 0 && c <= 11171 && c % 28 ? a : b; };
  const sessionByNo = (no) => board && board.sessions.find((s) => s.no === Number(no));

  function openDate(s) {
    return [s.applyStart, s.date, ...(s.milestones || []).map((m) => m.date)].filter(Boolean).sort()[0];
  }

  // 회차 상태: upcoming 예정 / apply 신청 중 / ready 준비 중 / today 오늘 / done 종료
  function statusOf(s) {
    const T = today();
    if (T > s.date) return { key: 'done', label: '종료', detail: '' };
    if (T === s.date) return { key: 'today', label: '오늘 진행', detail: s.time || '' };
    if (s.applyStart && s.applyEnd && T >= s.applyStart && T <= s.applyEnd) {
      const n = daysBetween(T, s.applyEnd);
      return { key: 'apply', label: `${s.applyLabel || '신청'} 중`, detail: n === 0 ? '오늘 마감' : `마감 D-${n}` };
    }
    if (T >= openDate(s)) return { key: 'ready', label: '준비 중', detail: `D-${daysBetween(T, s.date)}` };
    return { key: 'upcoming', label: '예정', detail: `${md(openDate(s))} 첫 공지` };
  }
  const isActive = (st) => ['apply', 'ready', 'today'].includes(st.key);

  function defaultSelection() {
    const withSt = board.sessions.map((s) => ({ s, st: statusOf(s) }));
    const pick = withSt.find((x) => x.st.key === 'today') || withSt.find((x) => x.st.key === 'apply')
      || withSt.find((x) => x.st.key === 'ready') || withSt.find((x) => x.st.key === 'upcoming')
      || withSt[withSt.length - 1];
    return pick ? pick.s.no : null;
  }

  async function loadBoard() {
    board = await api('getBoard');
    if (!sessionByNo(selectedNo)) {
      const q = Number(new URLSearchParams(location.search).get('s'));
      selectedNo = sessionByNo(q) ? q : defaultSelection();
    }
    renderScore();
  }

  /* ───── 오선 일정표 ───── */
  function renderScore() {
    const box = $('#score');
    if (!board || !board.sessions.length) { box.replaceChildren(); return; }
    const all = [];
    board.sessions.forEach((s) => {
      all.push(s.date);
      (s.milestones || []).forEach((m) => { all.push(m.date); if (m.endDate) all.push(m.endDate); });
    });
    all.sort();
    // 첫 달 1일 ~ 마지막 달 말일: 한 달이 한 마디
    const first = all[0], last = all[all.length - 1];
    const start = first.slice(0, 8) + '01';
    const ly = +last.slice(0, 4), lm = +last.slice(5, 7);
    const end = `${ly}-${String(lm).padStart(2, '0')}-${new Date(Date.UTC(ly, lm, 0)).getUTCDate()}`;
    const span = Math.max(1, daysBetween(start, end) + 1);
    const pct = (d) => Math.min(100, Math.max(0, daysBetween(start, d) / span * 100));
    const x = (d) => `${pct(d)}%`;
    const n = board.sessions.length;
    // 회차가 거듭될수록 음이 올라가는 선율
    const pitch = (i) => `calc(var(--g) * ${(Math.max(1, 7 - i * (6 / Math.max(1, n - 1)))) / 2})`;

    const track = el('div', { class: 'track' });
    const T = today();

    // 마디(월)
    let y0 = +start.slice(0, 4), m0 = +start.slice(5, 7);
    while (true) {
      const ms = `${y0}-${String(m0).padStart(2, '0')}-01`;
      if (ms > end) break;
      if (ms !== start) { const b = el('div', { class: 'bar' }); b.style.left = x(ms); track.append(b); }
      const lab = el('span', { class: 'month' }, `${m0}월`);
      lab.style.left = x(ms);
      track.append(lab);
      m0++; if (m0 > 12) { m0 = 1; y0++; }
    }
    const fin = el('div', { class: 'bar final' }); fin.style.left = '100%'; track.append(fin);

    const labels = new Map(); // 날짜 → 행사일 여부
    board.sessions.forEach((s, i) => {
      const sel = s.no === selectedNo;
      const y = pitch(i);
      (s.milestones || []).forEach((m) => {
        if (m.endDate) {
          // 신청 기간: 날짜 없이 막대로만
          const t = el('button', {
            class: 'tie' + (sel ? ' sel' : ''), 'data-tip': `${mdw(m.date)} ~ ${mdw(m.endDate)}\n${s.no}회 ${m.label}`,
            'aria-label': `${s.no}회 ${m.label}`, onclick: () => selectSession(s.no, true),
          });
          t.style.left = x(m.date);
          t.style.width = `calc(${x(m.endDate)} - ${x(m.date)} + ${100 / span}%)`;
          t.style.top = y;
          track.append(t);
          return;
        }
        const isEvent = m.date === s.date;
        const past = m.date < T || (isEvent && m.date <= T);
        const b = el('button', {
          class: 'note' + (isEvent ? ' event' : '') + (past ? ' past' : '') + (sel ? ' sel' : ''),
          'data-tip': `${mdw(m.date)}\n${s.no}회 ${m.label}`,
          'aria-label': `${s.no}회 ${m.label} ${md(m.date)}`,
          onclick: () => selectSession(s.no, true),
        }, isEvent ? ROMAN[s.no] : null);
        b.style.left = x(m.date);
        b.style.top = y;
        track.append(b);
        labels.set(m.date, labels.get(m.date) || isEvent);
      });
    });

    // 음표 날짜만 표시 (가까우면 두 번째 줄로)
    let lastRow1 = -99;
    [...labels.keys()].sort().forEach((d) => {
      const pos = pct(d);
      const row2 = pos - lastRow1 < 4.5;
      if (!row2) lastRow1 = pos;
      const l = el('span', { class: 'dlabel' + (row2 ? ' row2' : '') + (labels.get(d) ? ' ev' : '') }, md(d));
      l.style.left = x(d);
      track.append(l);
    });

    const ph = el('div', { class: 'playhead' }, el('span', {}, `${T < start ? '◀ ' : ''}오늘 ${dots(T)}${T > end ? ' ▶' : ''}`));
    ph.style.left = x(T);
    track.append(ph);

    box.replaceChildren(el('div', { class: 'staff' }), track);
    const sc = box.parentElement;
    if (sc.scrollWidth > sc.clientWidth) {
      requestAnimationFrame(() => { sc.scrollLeft = Math.max(0, ph.offsetLeft + track.offsetLeft - sc.clientWidth / 2); });
    }
  }

  function selectSession(no, scroll) {
    selectedNo = no;
    if (current.view !== 'home') { goHome(); return; }
    renderScore();
    renderHome();
    if (scroll) document.querySelector('.panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ───── 화면 이동 (브라우저 뒤로 가기 지원) ───── */
  function setNav(label) {
    $('#topnav').hidden = !label;
    $('#whereNow').textContent = label || '';
  }
  // 첫 화면으로: 지금 기록을 첫 화면으로 바꿔서 뒤로 가기가 꼬이지 않게
  function goHome() {
    history.replaceState({ v: 'home' }, '');
    showHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener('popstate', (e) => {
    const st = e.state || {};
    if (st.v === 'post' && st.id) showPost(st.id, null, false, true);
    else showHome();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-home]')) { e.preventDefault(); goHome(); }
  });
  history.replaceState({ v: 'home' }, '');

  /* ───── 첫 화면 ───── */
  async function showHome() {
    current = { view: 'home', postId: null };
    setNav('');
    if (!board) view.replaceChildren(el('div', { class: 'loading' }, '불러오는 중…'));
    try {
      await loadBoard();
      if (current.view !== 'home') return;
      renderHome();
    } catch (e) { handleErr(e); }
  }

  function renderHome() {
    const sessions = board.sessions;
    const tiles = el('div', { class: 'movements', role: 'tablist', 'aria-label': '멘토링 회차' },
      sessions.map((s) => {
        const st = statusOf(s);
        return el('button', {
          class: 'mv', role: 'tab', 'data-state': st.key, 'aria-selected': String(s.no === selectedNo),
          onclick: () => selectSession(s.no),
        },
          el('span', { class: 'num' }, ROMAN[s.no]),
          el('span', { class: 'nth' }, `${s.no}회`),
          el('span', { class: 'ttl' }, s.title),
          el('span', { class: 'when' }, `${mdw(s.date)} ${s.time || ''}`),
          s.place ? el('span', { class: 'where' }, s.place) : null,
          el('span', { class: 'badge' },
            isActive(st) ? el('span', { class: 'live', 'aria-hidden': 'true' }) : null,
            st.label, st.detail ? el('em', {}, st.detail) : null)
        );
      }));

    const s = sessionByNo(selectedNo);
    view.replaceChildren(tiles, s ? renderPanel(s) : '', adminToken ? renderNews() : '');
  }

  function renderPanel(s) {
    const st = statusOf(s);
    const T = today();
    const posts = board.posts.filter((p) => p.session === s.no);
    const ms = s.milestones || [];

    // 1) 진행 순서 (가로)
    let nextMarked = false;
    const steps = el('ol', { class: 'steps', style: `--n:${Math.max(1, ms.length)}` }, ms.map((m) => {
      const endD = m.endDate || m.date;
      let cls = '';
      if (endD < T) cls = 'done';
      else if (m.date <= T) cls = 'now';
      else if (!nextMarked) { cls = 'up'; nextMarked = true; }
      if (m.date === s.date) cls += ' event';
      return el('li', { class: cls.trim() },
        el('div', { class: 'sd' }, mdw(m.date) + (m.endDate ? ` ~ ${mdw(m.endDate)}` : '')),
        el('div', { class: 'sl' }, m.label));
    }));

    // 팀 편성 (teams 시트에 이 회차 팀이 있을 때)
    const teams = (board.teams || []).filter((t) => t.session === s.no);
    const wishOpen = st.key === 'apply' && s.applyType === 'comment';
    // 희망곡 기간에는 버튼을 눌러야 팀이 펼쳐지고, 그 외에는 팀 편성을 바로 보여줌
    // 희망곡 작성 기간에는 버튼을 눌러야 팀이 보이고, 기간 밖에는 팀 편성을 바로 보여줌
    const teamSec = teams.length && !wishOpen ? renderTeams(s, teams) : null;

    // 2) 공지 · 안내
    const adminBar = adminToken ? el('div', { class: 'admin-bar' },
      el('button', { class: 'btn primary', onclick: () => showEditor(null, s.no) }, '이 회차에 글쓰기'),
      s.applyType === 'form' ? el('a', { class: 'btn', href: 'admin.html', style: 'text-decoration:none' }, `신청 현황 (${s.applicants}${s.applyMode === 'team' ? '팀' : '명'})`) : null
    ) : null;
    const list = posts.length ? postList(posts, true)
      : el('div', { class: 'empty small' }, st.key === 'upcoming' ? `${mdw(openDate(s))}에 첫 공지가 올라옵니다.` : '아직 올라온 공지가 없습니다.');

    // 3) 다음 일정 → 신청 기간에는 바로 누르는 버튼
    const next = el('div');
    const dd = (n) => (n === 0 ? '오늘 마감' : `D-${n}`);
    if (st.key === 'apply' && s.applyType === 'form') {
      next.append(el('button', { class: 'cta', onclick: () => openApply(s) },
        `${s.applyLabel}하기`,
        el('small', {}, `${mdw(s.applyEnd)}까지 · `, el('b', {}, dd(daysBetween(T, s.applyEnd))))));
    } else if (wishOpen && teams.length) {
      next.append(el('button', { class: 'cta', 'aria-haspopup': 'dialog', onclick: () => openWishSheet(s) },
        `팀 확인 및 ${s.applyLabel}하기`,
        el('small', {}, `우리 팀을 골라 입력 · ${mdw(s.applyEnd)}까지 `, el('b', {}, dd(daysBetween(T, s.applyEnd))))));
    } else if (st.key === 'apply' && s.applyType === 'comment') {
      const target = posts.find((p) => p.pinned) || posts[0];
      next.append(target
        ? el('button', { class: 'cta', onclick: () => showPost(target.id, null, true) },
            `${s.applyLabel}하기`,
            el('small', {}, `공지글 댓글로 작성 · ${mdw(s.applyEnd)}까지 `, el('b', {}, dd(daysBetween(T, s.applyEnd)))))
        : el('div', { class: 'next' },
            el('p', { class: 'lbl' }, `${s.applyLabel} 진행 중`),
            el('p', { class: 'what' }, '공지글이 곧 올라옵니다'),
            el('p', { class: 'sub' }, '공지글이 올라오면 여기에 작성 버튼이 생깁니다.')));
    } else {
      let lbl = '다음 일정', what = '', sub = null;
      if (st.key === 'today') {
        lbl = '오늘'; what = `${s.title} 진행`;
        sub = [s.time, s.place].filter(Boolean).join(' · ');
      } else if (st.key === 'done') {
        lbl = '종료'; what = '모든 일정이 끝났습니다';
        sub = '공지와 댓글은 계속 볼 수 있습니다.';
      } else {
        const nm = ms.find((m) => m.date > T);
        if (nm) {
          const isApply = nm.endDate && s.applyStart === nm.date;
          what = `${nm.label}${isApply ? ' 예정' : ''}`;
          sub = el('span', {}, mdw(nm.date) + (nm.endDate ? ` ~ ${mdw(nm.endDate)}` : '') + ' · ',
            el('span', { class: 'dday' }, `D-${daysBetween(T, nm.date)}`));
        }
      }
      next.append(el('div', { class: 'next' },
        lbl !== '다음 일정' ? el('p', { class: 'lbl' }, lbl) : null, el('p', { class: 'what' }, what), sub ? el('p', { class: 'sub' }, sub) : null));
    }
    if (s.applyType === 'form' && ['apply', 'ready', 'today'].includes(st.key)) {
      next.append(el('div', { class: 'under-links' }, el('button', { class: 'link', onclick: openCheck }, '내 신청 확인하기')));
    }

    return el('div', { class: 'panel', role: 'tabpanel', 'aria-label': `${s.no}회 ${s.title}` },
      el('section', {}, el('h3', {}, '진행 순서'), steps),
      teamSec,
      el('section', {}, el('h3', {}, '공지 · 안내', el('span', { class: 'cnt' }, `${posts.length}건`)), adminBar, list),
      el('section', {}, el('h3', {}, st.key === 'apply' ? '지금 할 일' : '다음 일정'), next));
  }

  /* ───── 팀 편성 · 희망곡 ───── */
  // 편성 이름 비교: 띄어쓰기와 괄호 속 인원 표기는 무시 (예: '피아노 트리오(1)' = '피아노트리오')
  const normEns = (x) => String(x || '').replace(/\(.*?\)|（.*?）/g, '').replace(/\s/g, '');
  const songsFor = (s, t) => (board.songs || []).filter((x) => x.session === s.no && normEns(x.ensemble) === normEns(t.ensemble));
  // 팀의 지정곡: teams 탭 fixedSong 우선, 없으면 songs 탭에서 detail이 '지정곡'인 곡
  const isFixedRow = (x) => /^지정곡$/.test(String(x.detail || '').trim());
  const fixedOf = (s, t) => t.fixedSong || (songsFor(s, t).find((x) => x.song && isFixedRow(x)) || {}).song || '';

  // 같은 회차에서 두 팀 이상에 이름이 나오는 학생 → { 이름: [팀, 팀] }
  function dupMap(sessionNo) {
    const by = {};
    (board.teams || []).filter((t) => t.session === sessionNo).forEach((t) =>
      new Set(t.members.map((m) => m.name)).forEach((n) => (by[n] = by[n] || []).push(t.team)));
    Object.keys(by).forEach((n) => { if (by[n].length < 2) delete by[n]; });
    return by;
  }
  function dupNote(sessionNo) {
    const d = dupMap(sessionNo);
    const names = Object.keys(d);
    return names.length ? el('p', { class: 'dup-note' }, el('b', {}, '*'), ` 표시는 두 팀 이상에 중복 참여하는 학생입니다 (${names.length}명: ${names.join(', ')})`) : null;
  }

  function groupTeams(teams) {
    const groups = [];
    teams.forEach((t) => {
      let g = groups.find((x) => x.name === t.ensemble);
      if (!g) groups.push(g = { name: t.ensemble, teams: [] });
      g.teams.push(t);
    });
    return groups;
  }

  // 팀 카드: 머리(팀 이름) / 구성원 / 곡  세 칸으로 구분
  function teamCard(s, t, mode) {
    const pick = mode === 'pick';
    const songs = el('div', { class: 'songs' });
    const wishRows = () => t.wishes.map((w) => el('div', { class: 'row' },
      el('span', { class: 'song' }, w.song, el('span', { class: 'who' }, w.name)),
      mode === 'edit' || adminToken ? el('button', { class: 'del', type: 'button',
        onclick: (e) => { e.stopPropagation(); removeWish(s, w); } }, '삭제') : null));
    let key = '', keyCls = '', extra = null;
    if (t.selectedSong) { key = '확정곡'; keyCls = 'sel'; songs.append(el('span', { class: 'song' }, t.selectedSong)); }
    else if (fixedOf(s, t)) {
      key = '지정곡';
      songs.append(el('span', { class: 'song' }, fixedOf(s, t)));
      extra = el('div', { class: 'team-sec' }, el('span', { class: 'k' }, `팀 희망곡 ${t.wishes.length}`),
        el('div', { class: 'songs' }, ...(t.wishes.length ? wishRows() : [el('span', { class: 'none' }, '아직 선택하지 않았어요')])));
    } else {
      key = `팀 희망곡 ${t.wishes.length}`;
      if (t.wishes.length) songs.append(...wishRows());
      else songs.append(el('span', { class: 'none' }, '아직 입력된 희망곡이 없어요'));
    }
    const parts = [
      el('div', { class: 'team-top' }, el('b', {}, t.team), el('span', {}, `${t.members.length}명`)),
      el('div', { class: 'team-sec' }, el('span', { class: 'k' }, '구성원'),
        el('div', { class: 'members' }, t.members.length
          ? t.members.map((m) => {
              const other = (dupMap(s.no)[m.name] || []).filter((x) => x !== t.team);
              return el('span', { class: 'mchip', title: other.length ? `중복 참여: ${other.join(', ')}에도 참여` : null },
                el('b', {}, m.name), other.length ? el('span', { class: 'dup', 'aria-label': '중복 참여' }, '*') : null,
                m.part ? el('small', {}, m.part) : null);
            })
          : el('span', { class: 'meta' }, '구성원 입력 전'))),
      el('div', { class: 'team-sec' }, el('span', { class: 'k ' + keyCls }, key), songs),
      extra,
      pick ? el('div', { class: 'team-act' }, el('button', { type: 'button', tabindex: '-1' },
        t.wishes.length ? '희망곡 추가 입력' : '희망곡 입력')) : null,
    ];
    return pick
      ? el('div', { class: 'team pick' + (fixedOf(s, t) ? ' fixed' : ''), role: 'button', tabindex: '0', 'aria-label': `${t.team} 희망곡 입력`,
          onclick: () => wishStep2(s, t),
          onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wishStep2(s, t); } } }, ...parts)
      : el('div', { class: 'team' }, ...parts);
  }

  function renderTeams(s, teams) {
    // 인원은 중복 참여 학생을 한 번만 셈
    const people = new Set(teams.flatMap((t) => t.members.map((m) => m.name))).size;
    return el('section', { class: 'team-block', id: 'teamSec' },
      el('h3', {}, '팀 편성', el('span', { class: 'cnt' }, `${teams.length}팀${people ? ' · ' + people + '명' : ''}`)),
      ...groupTeams(teams).map((g) => el('div', { class: 'ens' },
        el('div', { class: 'ens-head' }, el('b', {}, g.name), el('span', {}, `${g.teams.length}팀`)),
        el('div', { class: 'teams' }, g.teams.map((t) => teamCard(s, t, 'view'))))),
      dupNote(s.no));
  }

  function applyTeams(sessionNo, updated) {
    board.teams = (board.teams || []).filter((x) => x.session !== sessionNo).concat(updated);
    if (current.view === 'home') renderHome();
  }

  async function removeWish(s, w) {
    try {
      let updated;
      if (adminToken) {
        if (!confirm(`"${w.song}" 희망곡을 삭제할까요?`)) return;
        updated = await api('adminDeleteTeamWish', adminToken, w.id);
      } else {
        const pw = prompt('희망곡을 입력할 때 정한 비밀번호 4자리를 입력하세요.');
        if (!pw) return;
        updated = await api('deleteTeamWish', w.id, pw);
      }
      applyTeams(s.no, updated);
      if (wishDlg.open && wishState) wishStep2(s, board.teams.find((x) => x.session === s.no && x.team === wishState.team) || wishState);
      toast('희망곡을 삭제했습니다.');
    } catch (e) { handleErr(e); }
  }

  /* 희망곡 창: 1단계 팀 선택 → 2단계 곡 입력 (팝업 안에서 화면 전환) */
  const wishDlg = $('#wishDlg');
  let wishState = null;
  wishDlg.addEventListener('close', () => { wishState = null; if (current.view === 'home') renderHome(); });

  function sheetHead(title, sub, backFn) {
    return el('div', { class: 'sheet-head' },
      backFn ? el('button', { type: 'button', onclick: backFn }, '← 팀 선택') : null,
      el('h3', {}, title, sub ? el('div', { class: 'sub' }, sub) : null),
      el('button', { type: 'button', onclick: () => wishDlg.close(), 'aria-label': '닫기' }, '닫기'));
  }

  function openWishSheet(s) {
    wishStep1(s);
    if (!wishDlg.open) wishDlg.showModal();
  }

  function wishStep1(s) {
    wishState = null;
    const teams = (board.teams || []).filter((t) => t.session === s.no);
    wishDlg.replaceChildren(
      sheetHead(`${s.no}회 팀 확인 및 ${s.applyLabel}`, `${mdw(s.applyEnd)} 마감 · 우리 팀을 선택하세요`),
      el('div', { class: 'sheet-body' },
        el('p', { class: 'teams-hint' }, '팀 카드를 누르면 희망곡을 입력할 수 있어요. 지정곡이 있는 팀은 지정곡 그대로 진행할지, 기타 곡을 희망할지 선택해 주세요.'),
        ...groupTeams(teams).map((g) => el('div', { class: 'ens' },
          el('div', { class: 'ens-head' }, el('b', {}, g.name), el('span', {}, `${g.teams.length}팀`)),
          el('div', { class: 'teams' }, g.teams.map((t) => teamCard(s, t, 'pick'))))),
        dupNote(s.no)));
    wishDlg.querySelector('.sheet-body').scrollTop = 0;
  }

  function wishStep2(s, t) {
    wishState = t;
    // 지정곡이 있는 팀은 그 곡만 목록에 두고 기본 선택
    // 목록: [지정곡] → 그 밖의 지정곡 목록 → 기타
    const fixedSong = fixedOf(s, t);
    const fixed = !!fixedSong;
    const list = [];
    if (fixed) list.push({ song: fixedSong, detail: '', fixed: true });
    songsFor(s, t).filter((x) => x.song && x.song !== fixedSong).forEach((x) => list.push({ song: x.song, detail: isFixedRow(x) ? '' : x.detail, fixed: isFixedRow(x) }));
    const guide = songsFor(s, t).find((x) => !x.song && x.detail);
    const OTHER = '__other__';

    const whoField = t.members.length
      ? el('div', { class: 'fl' }, '작성자',
          el('div', { class: 'who-pick' }, t.members.map((m, i) =>
            el('label', {}, el('input', { type: 'radio', name: 'who', value: m.name, required: true, checked: t.members.length === 1 && i === 0 }),
              m.name + ((dupMap(s.no)[m.name] || []).length ? '*' : '') + (m.part ? ` · ${m.part}` : '')))))
      : el('label', { class: 'fl' }, '작성자 이름', el('input', { name: 'who', required: true, maxlength: 20 }));

    // 곡: 지정곡 드롭다운 + 기타(직접 입력)
    const sel = list.length ? el('select', { name: 'pick', required: true },
      el('option', { value: '' }, '곡을 선택하세요'),
      list.map((x, i) => el('option', { value: String(i) }, x.fixed ? `[지정곡] ${x.song}` : x.song)),
      el('option', { value: OTHER }, '기타 (지정곡 외 직접 입력)')) : null;
    const fixedNote = fixed ? el('div', { class: 'song-guide' }, '지정곡으로 진행하려면 지정곡을, 다른 곡을 희망하면 기타를 선택해 주세요.') : null;
    const detailBox = el('div', { class: 'song-guide', hidden: true });
    const memoWrap = el('label', { class: 'fl', hidden: true }, el('span', {}, '악장 · 번호 ', el('small', {}, '(선택 조건이 있는 곡은 적어 주세요)')),
      el('input', { name: 'memo', maxlength: 100, placeholder: '예: I, III악장 / No. 1, 5' }));
    const otherWrap = el('label', { class: 'fl', hidden: !!list.length }, list.length ? '직접 입력' : '희망곡',
      guide ? el('div', { class: 'song-guide' }, guide.detail) : null,
      el('textarea', { name: 'other', maxlength: 300, style: 'min-height:80px', required: !list.length,
        placeholder: '작곡가, 곡명, 악장을 적어 주세요.\n예: F. Kreisler, Liebesleid' }));
    if (sel) sel.addEventListener('change', () => {
      const v = sel.value;
      const x = v !== '' && v !== OTHER ? list[+v] : null;
      detailBox.hidden = !(x && x.detail);
      detailBox.textContent = x && x.detail ? `선택 안내: ${x.detail}` : '';
      memoWrap.hidden = !(x && x.detail);
      otherWrap.hidden = v !== OTHER;
      otherWrap.querySelector('textarea').required = v === OTHER;
    });

    const whoWrap = whoField;
    const pwWrap = el('label', { class: 'fl' }, el('span', {}, '비밀번호 ', el('small', {}, '(숫자 4자리 · 삭제할 때 필요)')),
      el('input', { name: 'pw', type: 'password', inputmode: 'numeric', pattern: '\\d{4}', maxlength: 4, required: true }));
    const submitBtn = el('button', { type: 'submit', class: 'btn primary', style: 'padding:12px;font-size:16px' }, '팀 희망곡에 기록');

    const form = el('form', { class: 'wish-form', onsubmit: async (ev) => {
        ev.preventDefault();
        const f = form.elements;
        let song;
        if (sel && sel.value !== OTHER) {
          const x = list[+sel.value];
          if (!x) { toast('곡을 선택해 주세요.', true); return; }
          const memo = f['memo'].value.trim();
          song = (x.fixed ? '[지정곡] ' : '') + x.song + (memo ? ` (${memo})` : '');
        } else {
          song = f['other'].value.trim();
          if (!song) { toast('희망곡을 입력해 주세요.', true); return; }
          if (sel) song = '[기타] ' + song;
        }
        const btn = submitBtn;
        btn.disabled = true;
        try {
          const updated = await api('addTeamWish', s.no, t.team, f['who'].value, song, f['pw'].value);
          applyTeams(s.no, updated);
          toast(`${t.team} 희망곡에 기록했습니다.`);
          wishStep2(s, updated.find((x) => x.team === t.team) || t);
        } catch (e) { toast(e.message, true); btn.disabled = false; }
      } },
      sel ? el('label', { class: 'fl' }, '희망곡', sel) : null, fixedNote, detailBox, memoWrap, otherWrap,
      whoField, pwWrap, submitBtn);

    wishDlg.replaceChildren(
      sheetHead(`${t.team} 희망곡 입력`, `${t.ensemble} · ${mdw(s.applyEnd)} 마감`, () => wishStep1(s)),
      el('div', { class: 'sheet-body' },
        el('div', { class: 'wish-grid' }, teamCard(s, t, 'edit'), form)));
    if (!wishDlg.open) wishDlg.showModal();
  }

  function postList(posts, compact) {
    return el('ul', { class: 'list' + (compact ? ' compact' : '') }, posts.map((p) =>
      el('li', {}, el('button', { onclick: () => showPost(p.id) },
        el('span', { class: 't' },
          p.pinned ? el('span', { class: 'pin' }, '고정') : null,
          !compact && p.session ? el('span', { class: 'stag' }, `${p.session}회`) : null,
          p.title,
          p.fileCount ? el('span', { class: 'clip' }, `첨부 ${p.fileCount}`) : null),
        el('span', { class: 'cc' }, p.commentCount ? `댓글 ${p.commentCount}` : ''),
        el('span', { class: 'meta' }, fmt(p.createdAt))))));
  }

  function renderNews() {
    const opts = [['all', '전체'], ['0', '공통']].concat(board.sessions.map((s) => [String(s.no), `${s.no}회`]));
    const posts = board.posts.filter((p) => newsFilter === 'all' || String(p.session) === newsFilter);
    const chips = el('div', { class: 'chips' }, opts.map(([v, label]) =>
      el('button', { class: 'chip', 'aria-pressed': String(newsFilter === v), onclick: () => { newsFilter = v; renderHome(); } }, label)));

          el('a', { class: 'btn', href: 'admin.html', style: 'text-decoration:none' }, '관리자 페이지'),
          el('button', { class: 'btn primary', onclick: () => showEditor(null, 0) }, '공통 공지 쓰기')) : null),
      el('div', { style: 'margin-bottom:12px' }, chips),
      posts.length ? postList(posts, false) : el('div', { class: 'empty small' }, '해당하는 글이 없습니다.'));
  }

  /* ───── 신청 ───── */
  const applyDlg = $('#applyDlg');
  /* ───── 참가 신청 ─────
   * 개인(2회): 이름 / 참여 여부 / 레슨 곡목
   * 팀(3~4회): 본인 이름 / 실내악 편성 / 팀원 이름 / 참여 여부 / 레슨 곡목 — 팀원 중 한 명만 신청
   * 비밀번호 4자리: 같은 이름(팀)으로 다시 내면 그 비밀번호로 수정됨 */
  function rosterNames() {
    return [...new Set((board.teams || []).flatMap((t) => t.members.map((m) => m.name)))].sort((x, y) => x.localeCompare(y, 'ko'));
  }
  function rosterTeams() {
    const firstNo = (board.teams || []).reduce((n, t) => Math.min(n, t.session), 99);
    return (board.teams || []).filter((t) => t.session === firstNo);
  }

  function openApply(s) {
    const team = s.applyMode === 'team';
    const OTHER = '__direct__';
    const names = rosterNames();
    const nameList = el('datalist', { id: 'rosterNames' }, names.map((n) => el('option', { value: n })));

    const attendSeg = el('div', { class: 'seg', role: 'radiogroup', 'aria-label': '참여 여부' },
      ['참여', '불참'].map((v) => el('label', {}, el('input', { type: 'radio', name: 'attend', value: v, required: true }), v)));
    const songWrap = el('label', { class: 'full' }, el('span', {}, '레슨 곡목 ', el('small', {}, team ? '(실내악 곡명 · 악장)' : '(작곡가 · 곡명 · 악장)')),
      el('textarea', { name: 'song', maxlength: 300, style: 'min-height:70px',
        placeholder: team ? '예: A. Arensky, Piano Trio No. 1, Op. 32, 1악장' : '예: J. Brahms, Violin Sonata No. 1, 1악장' }));
    const syncAttend = () => {
      const v = (form.querySelector('input[name=attend]:checked') || {}).value;
      songWrap.hidden = v === '불참';
      songWrap.querySelector('textarea').required = v === '참여';
    };

    // 팀 신청: 1회차 팀 편성에서 고르면 편성·팀원·곡이 채워짐
    let teamFields = [];
    if (team) {
      const teams = rosterTeams();
      const ensembles = [...new Set(teams.map((t) => t.ensemble))];
      const teamSel = el('select', { name: 'team' },
        el('option', { value: '' }, teams.length ? '우리 팀 선택' : '팀 편성 없음'),
        teams.map((t) => el('option', { value: t.team }, `${t.team} (${t.ensemble})`)),
        el('option', { value: OTHER }, '직접 입력'));
      const ensSel = el('input', { name: 'ensemble', required: true, maxlength: 40, list: 'ensList', placeholder: '예: 피아노 트리오' });
      const ensList = el('datalist', { id: 'ensList' }, ensembles.concat(['피아노 트리오', '피아노 듀오', '바이올린 & 피아노'].filter((x) => !ensembles.includes(x))).map((x) => el('option', { value: x })));
      const members = el('input', { name: 'members', required: true, maxlength: 200, placeholder: '예: 김OO, 이OO, 박OO' });
      teamSel.addEventListener('change', () => {
        const t = teams.find((x) => x.team === teamSel.value);
        if (!t) return;
        ensSel.value = t.ensemble;
        members.value = t.members.map((m) => m.name).join(', ');
        const sa = form.elements['song'];
        if (!sa.value) sa.value = t.selectedSong || fixedOf({ no: t.session }, t) || '';
      });
      teamFields = [
        teams.length ? el('label', { class: 'full' }, el('span', {}, '우리 팀 ', el('small', {}, '(고르면 편성과 팀원이 채워져요)')), teamSel) : null,
        el('label', {}, '실내악 편성', ensSel, ensList),
        el('label', {}, el('span', {}, '팀원 이름 ', el('small', {}, '(쉼표로 구분)')), members),
      ];
    }

    const form = el('form', { onsubmit: async (ev) => {
        ev.preventDefault();
        const f = form.elements;
        const attend = (form.querySelector('input[name=attend]:checked') || {}).value;
        if (!attend) { toast('참여 여부를 선택해 주세요.', true); return; }
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          const teamVal = team && f['team'] && f['team'].value !== OTHER ? f['team'].value : '';
          const r = await api('applySession', s.no, {
            name: f['name'].value, attend, song: f['song'].value, password: f['pw'].value,
            ensemble: team ? f['ensemble'].value : '', members: team ? f['members'].value : '', team: teamVal,
          });
          applyDlg.replaceChildren(el('div', { class: 'done-box' },
            el('div', { class: 'big' }, ROMAN[s.no]),
            el('h3', {}, r.updated ? `${r.title} 신청 내용을 수정했습니다` : `${r.title} 신청이 완료되었습니다`),
            el('p', { class: 'meta' }, attend === '참여'
              ? `멘토링 당일(${mdw(s.date)})까지 이 회차의 공지를 확인해 주세요.`
              : '불참으로 접수되었습니다. 바뀌면 마감 전까지 같은 이름과 비밀번호로 다시 신청해 주세요.'),
            el('div', { class: 'form-end', style: 'justify-content:center' },
              el('button', { class: 'btn primary', onclick: () => applyDlg.close() }, '확인'))));
          loadBoard().then(() => current.view === 'home' && renderHome()).catch(() => {});
        } catch (e) { toast(e.message, true); btn.disabled = false; }
      } },
      el('h3', {}, `${ROMAN[s.no]}. ${s.title} 신청`),
      el('p', { class: 'meta', style: 'margin:-8px 0 16px' }, `${mdw(s.date)} ${s.time || ''} · ${s.place || ''} / 마감 ${mdw(s.applyEnd)}`),
      team ? el('p', { class: 'apply-note', style: 'margin:0 0 14px' }, '팀원 중 한 명만 신청하면 팀 전체가 신청됩니다.') : null,
      el('div', { class: 'fgrid' },
        el('label', { class: 'full' }, team ? '본인 이름' : '이름',
          el('input', { name: 'name', required: true, maxlength: 20, autocomplete: 'name', list: names.length ? 'rosterNames' : null }), nameList),
        ...teamFields,
        el('div', { class: 'full', style: 'display:grid;gap:6px;font-size:14px;font-weight:600' }, '참여 여부', attendSeg),
        songWrap,
        el('label', { class: 'full' }, el('span', {}, '비밀번호 ', el('small', {}, '(숫자 4자리 · 마감 전 수정할 때 필요)')),
          el('input', { name: 'pw', type: 'password', inputmode: 'numeric', pattern: '\\d{4}', maxlength: 4, required: true }))),
      el('div', { class: 'form-end', style: 'margin-top:16px' },
        el('button', { type: 'button', class: 'btn', onclick: () => applyDlg.close() }, '취소'),
        el('button', { type: 'submit', class: 'btn primary' }, '신청하기')));
    form.addEventListener('change', (e) => { if (e.target.name === 'attend') syncAttend(); });
    applyDlg.replaceChildren(form);
    applyDlg.showModal();
  }

  function openCheck() {
    const out = el('div');
    const form = el('form', { onsubmit: async (ev) => {
        ev.preventDefault();
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          const list = await api('checkApplication', form.elements['name'].value);

                el('div', {}, el('span', { class: 'stag' }, `${a.session}회`), a.title, ' · ', el('b', {}, a.attend)),
                el('div', { class: 'meta' }, [a.team || a.ensemble, a.applicant !== form.elements['name'].value.trim() ? `신청자 ${a.applicant}` : '', a.song, `${fmt(a.createdAt)} 접수`].filter(Boolean).join(' · ')))))
            : el('p', { class: 'meta', style: 'margin-top:14px' }, '신청 내역이 없습니다. 이름을 다시 확인해 주세요.'));
        } catch (e) { toast(e.message, true); }
        btn.disabled = false;
      } },
      el('h3', {}, '내 신청 확인하기'),

      el('div', { class: 'fgrid' },
        el('label', { class: 'full' }, '이름', el('input', { name: 'name', required: true, maxlength: 20 }))),
      el('div', { class: 'form-end', style: 'margin-top:14px' },
        el('button', { type: 'button', class: 'btn', onclick: () => applyDlg.close() }, '닫기'),
        el('button', { type: 'submit', class: 'btn primary' }, '조회')),
      out);
    applyDlg.replaceChildren(form);
    applyDlg.showModal();
  }

  /* ───── 상세 + 댓글 ───── */
  async function showPost(id, data, focusComment, fromPop) {
    if (!fromPop && !(current.view === 'post' && current.postId === id)) {
      // 글쓰기에서 넘어온 경우는 기록을 바꾸고, 그 외에는 새 기록을 쌓음
      if (current.view === 'editor') history.replaceState({ v: 'post', id }, '');
      else history.pushState({ v: 'post', id }, '');
    }
    current = { view: 'post', postId: id };
    if (!data) view.replaceChildren(el('div', { class: 'loading' }, '불러오는 중…'));
    try {
      const p = data || await api('getPost', id);
      renderPost(p);
      if (focusComment) {
        // 희망곡 작성하기 → 댓글 입력칸으로 바로 이동
        const f = document.querySelector('.cform');
        if (f) { f.scrollIntoView({ block: 'center' }); f.elements['name'].focus({ preventScroll: true }); return; }
      }
      window.scrollTo(0, 0);
    } catch (e) { handleErr(e); goHome(); }
  }

  function renderPost(p) {
    const ss = p.session ? sessionByNo(p.session) : null;
    const back = el('div', { class: 'toolbar' },
      el('button', { class: 'btn', onclick: () => { if (ss) selectedNo = ss.no; goHome(); } }, ss ? `← ${ss.no}회 ${ss.title} 화면으로` : '← 처음으로'));
    setNav(ss ? `${ss.no}회 ${ss.title} · ${p.title}` : p.title);

    const art = el('article', {},
      ss ? el('div', { class: 'crumb' }, el('span', { class: 'stag' }, `${ss.no}회 · ${ss.title}`)) : null,
      el('h2', {}, p.pinned ? el('span', { class: 'pin' }, '고정') : null, p.title),
      el('div', { class: 'meta' }, fmt(p.createdAt) + (p.updatedAt ? ` (수정 ${fmt(p.updatedAt)})` : '')),
      renderBody(p.content),
      renderAttachments(p.attachments || []),
      adminToken ? el('div', { class: 'admin-actions' },
        el('button', { class: 'btn', onclick: () => showEditor(p) }, '수정'),
        el('button', { class: 'btn danger', onclick: () => removePost(p.id) }, '삭제')
      ) : null
    );

    const list = p.comments.map((c) =>
      el('div', { class: 'c' },
        el('div', { class: 'c-head' },
          el('span', { class: 'c-name' }, c.name),
          el('span', { class: 'meta' }, fmt(c.createdAt)),
          el('button', { class: 'link danger', onclick: () => removeComment(c.id) }, '삭제')
        ),
        el('div', { class: 'c-body' }, c.content)
      ));

    const form = el('form', { class: 'cform', onsubmit: (ev) => submitComment(ev, p.id) },
      el('div', { class: 'row' },
        el('input', { name: 'name', placeholder: '이름', maxlength: 20, required: true, autocomplete: 'name' }),
        el('input', { name: 'pw', type: 'password', inputmode: 'numeric', pattern: '\\d{4}', maxlength: 4, placeholder: '비밀번호 4자리', required: true })
      ),
      el('textarea', { name: 'content', placeholder: '댓글을 입력하세요', maxlength: 1000, required: true }),
      el('div', { class: 'form-end' },
        el('span', { class: 'hint' }, '비밀번호는 내 댓글을 삭제할 때 필요합니다.'),
        el('button', { class: 'btn primary', type: 'submit' }, '댓글 등록')
      )
    );

    const sec = el('section', { class: 'comments' },
      el('h3', {}, '댓글 ', el('span', {}, String(p.comments.length))),
      list.length ? list : el('p', { class: 'meta' }, '첫 댓글을 남겨 보세요.'),
      form
    );

    view.replaceChildren(back, art, sec);
  }

  /* ───── 서식 본문 ───── */
  // 서식 편집기로 쓴 글은 HTML, 예전 글은 일반 텍스트
  const isHtml = (s) => /^\s*<(p|h[1-6]|ol|ul|blockquote|pre|div)[\s>]/i.test(s || '');

  function renderBody(content) {
    if (!isHtml(content) || !window.DOMPurify) {
      return el('div', { class: 'body plain' }, isHtml(content) ? stripTags(content) : content);
    }
    const div = el('div', { class: 'body rich' });
    div.innerHTML = DOMPurify.sanitize(content, {
      ALLOWED_TAGS: ['p', 'br', 'h2', 'h3', 'strong', 'b', 'em', 'i', 'u', 's', 'span', 'a', 'ol', 'ul', 'li', 'blockquote'],
      ALLOWED_ATTR: ['href', 'class', 'style'],
    });
    div.querySelectorAll('a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
    return div;
  }

  // DOMParser로 읽으면 스크립트·이미지가 실행되지 않음
  function stripTags(html) {
    const doc = new DOMParser().parseFromString(
      String(html).replace(/<\/(p|h\d|li|blockquote)>/gi, '$&\n'), 'text/html');
    doc.querySelectorAll('script, style').forEach((n) => n.remove());
    return doc.body.textContent.trim();
  }

  const TOOL_TITLES = {
    'ql-header': '문단 종류', 'ql-size': '글자 크기', 'ql-bold': '굵게', 'ql-italic': '기울임',
    'ql-underline': '밑줄', 'ql-strike': '취소선', 'ql-color': '글자색', 'ql-background': '형광펜',
    'ql-list': '목록', 'ql-align': '정렬', 'ql-indent': '들여쓰기', 'ql-blockquote': '인용 상자',
    'ql-link': '링크', 'ql-clean': '서식 지우기',
  };

  function createRichEditor(host) {
    const brand = ['#212326', '#176C86', '#1C6077', '#E84958', '#62686D'];
    const quill = new Quill(host, {
      theme: 'snow',
      placeholder: '내용을 입력하세요',
      formats: ['header', 'size', 'bold', 'italic', 'underline', 'strike', 'color', 'background',
                'list', 'indent', 'align', 'blockquote', 'link'],
      modules: {
        toolbar: [
          [{ header: [2, 3, false] }, { size: ['small', false, 'large'] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ color: brand }, { background: ['#FFE3D9', '#E6F0F3', '#FFF3B0', false] }],
          [{ list: 'ordered' }, { list: 'bullet' }, { indent: '-1' }, { indent: '+1' }],
          [{ align: [] }, 'blockquote', 'link'],
          ['clean'],
        ],
      },
    });
    // 도구 버튼에 한글 설명(마우스를 올리면 표시)
    const bar = host.previousElementSibling;
    if (bar) {
      bar.querySelectorAll('button, .ql-picker').forEach((b) => {
        const cls = [...b.classList].find((c) => TOOL_TITLES[c]);
        if (!cls) return;
        let t = TOOL_TITLES[cls];
        if (cls === 'ql-list') t = b.value === 'ordered' ? '번호 목록' : '글머리 목록';
        if (cls === 'ql-indent') t = b.value === '-1' ? '내어쓰기' : '들여쓰기';
        b.setAttribute('title', t);
        if (b.tagName === 'BUTTON') b.setAttribute('aria-label', t);
      });
    }
    return quill;
  }

  function editorHtml(quill) {
    if (!quill.getText().trim()) return '';
    // Quill 2.0.3은 공백을 &nbsp;로 바꿔 줄바꿈이 어색해지므로 일반 공백으로 되돌림
    return quill.getSemanticHTML().replace(/&nbsp;/g, ' ');
  }

  /* ───── 첨부파일 ───── */
  const imgUrl = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
  const viewUrl = (id) => `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
  const downUrl = (id) => `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`;

  function fsize(n) {
    if (!n) return '';
    if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + 'KB';
    return (n / 1024 / 1024).toFixed(1) + 'MB';
  }
  function ext(name) {
    const m = /\.([a-z0-9]{1,5})$/i.exec(name || '');
    return m ? m[1].toUpperCase() : 'FILE';
  }

  function renderAttachments(list) {
    const imgs = list.filter((a) => a.image);
    const frag = document.createDocumentFragment();
    if (imgs.length) {
      frag.append(el('div', { class: 'gallery' + (imgs.length === 1 ? ' single' : '') },
        imgs.map((a) => el('a', { href: viewUrl(a.id), target: '_blank', rel: 'noopener' },
          el('img', { src: imgUrl(a.id, 1600), alt: a.name, loading: 'lazy' })))));
    }
    // 원본 내려받기 목록 (그림 포함 전체)
    if (list.length) {
      frag.append(el('ul', { class: 'files' }, list.map((a) =>
        el('li', {}, el('a', { href: downUrl(a.id), target: '_blank', rel: 'noopener' },
          el('span', { class: 'ftag' }, ext(a.name)),
          el('span', { class: 'fname' }, a.name),
          el('span', { class: 'fsize' }, fsize(a.size)))))));
    }
    return frag;
  }

  const MAX_FILE_MB = 10;
  const MAX_FILES = 10;

  // 큰 사진은 가로 2000px로 줄여서 업로드 (JPEG·WebP·PNG)
  async function shrinkImage(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5 * 1024 * 1024) return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.type === 'image/png') return file;
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      const blob = await new Promise((r) => c.toBlob(r, type, 0.88));
      if (!blob || blob.size >= file.size) return file;
      const name = type === 'image/jpeg' ? file.name.replace(/\.(png|webp)$/i, '.jpg') : file.name;
      return new File([blob], name, { type });
    } catch (e) { return file; }
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
      r.readAsDataURL(file);
    });
  }

  async function submitComment(ev, postId) {
    ev.preventDefault();
    const f = ev.target;
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      const name = f.elements['name'].value;
      const p = await api('addComment', postId, name, f.elements['content'].value, f.elements['pw'].value);
      renderPost(p);
      document.querySelector('.cform [name=name]').value = name; // 이름은 유지
      toast('댓글을 등록했습니다.');
    } catch (e) { handleErr(e); btn.disabled = false; }
  }

  async function removeComment(id) {
    try {
      let p;
      if (adminToken) {
        if (!confirm('이 댓글을 삭제할까요?')) return;
        p = await api('adminDeleteComment', adminToken, id);
      } else {
        const pw = prompt('댓글 작성 시 입력한 비밀번호 4자리를 입력하세요.');
        if (!pw) return;
        p = await api('deleteOwnComment', id, pw);
      }
      renderPost(p);
      toast('댓글을 삭제했습니다.');
    } catch (e) { handleErr(e); }
  }

  async function removePost(id) {
    if (!confirm('이 글을 삭제할까요? 댓글도 함께 보이지 않게 됩니다.')) return;
    try {
      await api('deletePost', adminToken, id);
      toast('글을 삭제했습니다.');
      board = null; showHome();
    } catch (e) { handleErr(e); }
  }

  /* ───── 글쓰기 / 수정 (관리자) ───── */
  function showEditor(p = null, sessionNo = 0) {
    history.pushState({ v: 'editor' }, '');
    setNav(p ? '글 수정' : '새 글 작성');
    current = { view: 'editor', postId: p && p.id };
    const sessSel = el('select', { name: 'session', class: 'sess-sel' },
      el('option', { value: '0' }, '공통 공지 (전체)'),
      (board ? board.sessions : []).map((s) => el('option', { value: String(s.no) }, `${s.no}회 · ${s.title}`)));
    sessSel.value = String(p ? (p.session || 0) : sessionNo);
    // 첨부 목록: 업로드 완료된 항목은 meta를 가짐
    const items = (p && p.attachments || []).map((a) => ({ meta: a, state: 'done' }));
    let uploading = 0;

    const listEl = el('ul', { class: 'att-list' });
    const fileInput = el('input', { type: 'file', multiple: true, hidden: true });
    const drop = el('div', { class: 'drop', tabindex: '0', role: 'button' },
      el('b', {}, '파일 선택'), ' 또는 여기로 끌어다 놓기. 그림, 문서, 악보 모두 가능 (파일당 ' + MAX_FILE_MB + 'MB, 최대 ' + MAX_FILES + '개)');

    function drawList() {
      listEl.replaceChildren(...items.map((it) => {
        const name = it.meta ? it.meta.name : it.file.name;
        const isImg = it.meta ? it.meta.image : /^image\//.test(it.file.type);
        const thumb = isImg && (it.preview || (it.meta && imgUrl(it.meta.id, 120)))
          ? el('img', { class: 'thumb', src: it.preview || imgUrl(it.meta.id, 120), alt: '' })
          : el('span', { class: 'thumb' }, ext(name));
        const state = it.state === 'uploading' ? '올리는 중…'
          : it.state === 'error' ? it.error
          : fsize(it.meta && it.meta.size);
        return el('li', {}, thumb,
          el('span', { class: 'fname' }, name),
          el('span', { class: 'state' + (it.state === 'error' ? ' err' : '') }, state),
          it.state === 'uploading' ? null :
            el('button', { type: 'button', class: 'link danger', onclick: () => {
              items.splice(items.indexOf(it), 1);
              if (it.preview) URL.revokeObjectURL(it.preview);
              drawList();
            } }, '빼기'));
      }));
      submitBtn.disabled = uploading > 0;
      submitBtn.textContent = uploading > 0 ? '파일 올리는 중…' : (p ? '수정 완료' : '등록');
    }

    async function addFiles(fileList) {
      for (const raw of Array.from(fileList)) {
        if (items.length >= MAX_FILES) { toast(`첨부파일은 ${MAX_FILES}개까지 올릴 수 있습니다.`, true); break; }
        const it = { file: raw, state: 'uploading' };
        if (/^image\//.test(raw.type)) it.preview = URL.createObjectURL(raw);
        items.push(it);
        uploading++;
        drawList();
        try {
          const file = await shrinkImage(raw);
          if (file.size > MAX_FILE_MB * 1024 * 1024) throw new Error(`${MAX_FILE_MB}MB 초과`);
          const b64 = await toBase64(file);
          it.meta = await api('uploadFile', adminToken, file.name, file.type, b64);
          it.state = 'done';
        } catch (e) {
          it.state = 'error';
          it.error = e.message.length > 20 ? '업로드 실패' : e.message;
          if (/로그인이 만료/.test(e.message)) handleErr(e);
        }
        uploading--;
        drawList();
      }
    }

    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });

    const submitBtn = el('button', { type: 'submit', class: 'btn primary' }, p ? '수정 완료' : '등록');

    // 서식 편집기 (불러오기에 실패하면 일반 입력칸으로 대체)
    const useRich = !!window.Quill;
    const richHost = el('div');
    const plainBox = el('textarea', { name: 'content', placeholder: '내용', maxlength: 10000 });
    const contentBox = useRich ? el('div', { class: 'rich-wrap' }, richHost) : plainBox;
    let quill = null;

    const form = el('form', { class: 'editor', onsubmit: async (ev) => {
        ev.preventDefault();
        if (uploading > 0) return;
        if (items.some((it) => it.state === 'error') &&
            !confirm('올리지 못한 파일이 있습니다. 그 파일은 빼고 등록할까요?')) return;
        const content = quill ? editorHtml(quill) : plainBox.value.trim();
        if (!content) { toast('내용을 입력해 주세요.', true); (quill || plainBox).focus(); return; }
        submitBtn.disabled = true;
        try {
          const id = await api('savePost', adminToken, {
            id: p && p.id,
            title: form.elements['title'].value,
            content,
            pinned: form.elements['pinned'].checked,
            session: Number(sessSel.value),
            attachments: items.filter((it) => it.state === 'done').map((it) => it.meta),
          });
          toast(p ? '글을 수정했습니다.' : '글을 등록했습니다.');
          board = null;
          showPost(id);
        } catch (e) { handleErr(e); submitBtn.disabled = false; }
      } },
      el('label', { class: 'check', style: 'gap:12px' }, el('span', { style: 'font-weight:600' }, '게시 위치'), sessSel),
      el('input', { name: 'title', placeholder: '제목', maxlength: 100, required: true }),
      contentBox,
      drop, fileInput, listEl,
      el('label', { class: 'check' }, el('input', { type: 'checkbox', name: 'pinned' }), '목록 맨 위에 고정'),
      el('div', { class: 'form-end' },
        el('button', { type: 'button', class: 'btn', onclick: () => (p ? showPost(p.id) : goHome()) }, '취소'),
        submitBtn
      )
    );
    view.replaceChildren(el('div', { class: 'toolbar' }, el('strong', {}, p ? '글 수정' : '새 글 작성')), form);
    if (useRich) quill = createRichEditor(richHost);
    if (p) {
      form.elements['title'].value = p.title;
      form.elements['pinned'].checked = p.pinned;
      if (quill) {
        if (isHtml(p.content)) quill.clipboard.dangerouslyPasteHTML(window.DOMPurify ? DOMPurify.sanitize(p.content) : p.content);
        else quill.setText(p.content);
      } else {
        plainBox.value = isHtml(p.content) ? stripTags(p.content) : p.content;
      }
    }
    drawList();
    form.elements['title'].focus();
  }

  function render() {
    if (current.view === 'post') showPost(current.postId);
    else if (current.view === 'home' || !adminToken) showHome();
  }

  /* ───── 관리자 로그인 ───── */
  const dlg = $('#loginDlg');
  $('#adminToggle').addEventListener('click', () => {
    // 게시판 쪽 관리자 모드만 끝냄 (관리자 페이지 로그인은 그대로)
    setAdmin(null);
    toast('관리자 모드를 끝냈습니다.');
  });
  $('#loginCancel').addEventListener('click', () => dlg.close());
  $('#loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    try {
      const token = await api('adminLogin', $('#adminPw').value);
      dlg.close();
      setAdmin(token);
      toast('관리자로 로그인했습니다.');
    } catch (e) { toast(e.message, true); }
  });

  if (PREVIEW) $('#previewFlag').append(el('span', { class: 'preview-flag' }, `미리보기: ${PREVIEW} 기준 화면`));
  // 주소로 바로 열기: ?post=글번호 / 관리자 페이지에서 넘어온 글쓰기: ?edit=글번호, ?new=회차
  (async function init() {
    const q = new URLSearchParams(location.search);
    let handoff = null;
    try { handoff = JSON.parse(localStorage.getItem('mm_admin') || 'null'); localStorage.removeItem('mm_admin'); } catch (e) {}
    if (handoff && handoff.token && Date.now() - handoff.at < 60000 && (q.has('edit') || q.has('new'))) {
      try {
        await api('adminPing', handoff.token);
        adminToken = handoff.token;
        $('#adminToggle').hidden = false;
        await loadBoard();
        const clean = location.pathname + (PREVIEW ? `?today=${PREVIEW}` : '');
        history.replaceState({ v: 'home' }, '', clean);
        if (q.has('edit')) showEditor(await api('getPost', q.get('edit')));
        else showEditor(null, Number(q.get('new')) || 0);
        return;
      } catch (e) { toast(e.message, true); }
    }
    if (q.get('post')) { await showHome(); showPost(q.get('post')); return; }
    showHome();
  })();
</script>
</body>
