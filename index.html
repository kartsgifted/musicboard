<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K예술영재 프로젝트 음악분야 멘토링 게시판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<style>
  /* 페이퍼로지: 설치된 글꼴이 있으면 먼저 쓰고, 없으면 웹폰트로 불러옴 */
  @font-face { font-family: 'Paperlogy'; font-weight: 500; font-display: swap;
    src: local('페이퍼로지 5 Medium'), local('Paperlogy-5Medium'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Paperlogy'; font-weight: 600; font-display: swap;
    src: local('페이퍼로지 6 SemiBold'), local('Paperlogy-6SemiBold'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Paperlogy'; font-weight: 700; font-display: swap;
    src: local('페이퍼로지 7 Bold'), local('Paperlogy-7Bold'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Paperlogy'; font-weight: 800; font-display: swap;
    src: local('페이퍼로지 8 ExtraBold'), local('Paperlogy-8ExtraBold'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2'); }

  :root {
    --teal: #176C86;        /* 주조색 */
    --teal-deep: #1C6077;   /* 딥 청록 */
    --ivory: #FAF9F5;       /* 배경 */
    --ink: #212326;         /* 글자 먹색 */
    --coral: #E84958;       /* 좁은 면적 강조 */
    --apricot: #FFB098;     /* 넓은 면적·배지 배경 (글자색 사용 금지) */
    --muted: #62686D;
    --line: #E3E1D9;
    --surface: #FFFFFF;
    --teal-soft: #E6F0F3;
    --sans: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --head: 'Paperlogy', 'Pretendard', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ivory); color: var(--ink);
    font-family: var(--sans); font-size: 18px; line-height: 1.65;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
  main.wrap { padding-bottom: 80px; }

  /* 머리 영역: 딥 청록 위로 오선(五線)이 흐르는 배너 */
  header.board {
    position: relative; overflow: hidden;
    background: var(--teal-deep); color: #fff;
    padding: 72px 0 56px; margin-bottom: 48px;
    --staff-gap: 14px;
  }
  header.board::before {
    content: ''; position: absolute; left: 0; right: 0;
    top: calc(72px + var(--staff-gap) * 0.1); height: calc(var(--staff-gap) * 4 + 1px);
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, transparent 1px var(--staff-gap));
    pointer-events: none;
  }
  header.board::after {
    content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 6px;
    background: linear-gradient(to right, var(--coral) 0 96px, var(--teal) 96px);
  }
  header.board .wrap { position: relative; }
  header.board .en {
    margin: 0; font-family: var(--head); font-weight: 800;
    font-size: clamp(34px, 7vw, 56px); line-height: 1.05; letter-spacing: -0.01em;
  }
  header.board h1 {
    margin: 18px 0 0; font-family: var(--head); font-weight: 700;
    font-size: clamp(20px, 3.6vw, 26px); line-height: 1.4;
  }
  header.board p { margin: 8px 0 0; font-size: 16px; opacity: .8; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; min-height: 44px; }
  .count { color: var(--muted); font-size: 15px; }
  .count b { color: var(--ink); }

  .btn {
    border: 1px solid var(--line); background: var(--surface);
    padding: 9px 18px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 500;
  }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-family: var(--head); font-weight: 600; }
  .btn.primary:hover { background: var(--teal-deep); color: #fff; }
  .btn.danger:hover, .btn.danger { color: var(--coral); }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .link.danger:hover { color: var(--coral); }

  /* 목록: 카드 대신 줄 단위 목록, 상단 굵은 선으로 시작 */
  ul.list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  ul.list li { border-bottom: 1px solid var(--line); }
  ul.list button {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 20px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: 0; padding: 22px 4px; cursor: pointer;
  }
  ul.list button:hover { background: var(--surface); }
  ul.list button:hover .t { color: var(--teal); }
  .t { font-family: var(--head); font-size: 19px; font-weight: 600; line-height: 1.45; }
  .meta { color: var(--muted); font-size: 15px; }
  .cc { color: var(--coral); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .pin {
    display: inline-block; background: var(--apricot); color: var(--ink);
    font-size: 13px; font-weight: 700; padding: 1px 9px; border-radius: 2px; margin-right: 10px; vertical-align: 2px;
  }
  .empty { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); padding: 64px 20px; text-align: center; color: var(--muted); }

  /* 상세 */
  article { border-top: 2px solid var(--ink); padding: 32px 4px 8px; }
  article h2 { margin: 0 0 8px; font-family: var(--head); font-size: clamp(22px, 4vw, 28px); line-height: 1.4; }
  article .body { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); }
  article .body.plain { white-space: pre-wrap; }

  /* 서식 본문 (보기 화면과 편집 화면 공통) */
  .rich > :first-child { margin-top: 0; }
  .rich p { margin: 0; }
  .rich p:empty::after { content: '\00a0'; }
  .rich h2 { font-family: var(--head); font-weight: 700; font-size: 1.4em; line-height: 1.4; margin: 1.2em 0 .4em; }
  .rich h3 { font-family: var(--head); font-weight: 700; font-size: 1.15em; line-height: 1.45; margin: 1em 0 .3em; color: var(--teal-deep); }
  .rich ul, .rich ol { margin: .4em 0; padding-left: 1.6em; }
  .rich li { margin: .15em 0; }
  .rich blockquote { margin: .8em 0; padding: .4em 0 .4em 1em; border-left: 4px solid var(--teal); background: var(--teal-soft); }
  .rich a { color: var(--teal); text-underline-offset: 3px; }
  .rich strong { font-weight: 700; }
  .rich .ql-align-center { text-align: center; }
  .rich .ql-align-right { text-align: right; }
  .rich .ql-align-justify { text-align: justify; }
  .rich .ql-size-small { font-size: .85em; }
  .rich .ql-size-large { font-size: 1.3em; }
  .rich .ql-indent-1 { padding-left: 2em; } .rich .ql-indent-2 { padding-left: 4em; } .rich .ql-indent-3 { padding-left: 6em; }
  .rich li.ql-indent-1 { margin-left: 2em; padding-left: 0; } .rich li.ql-indent-2 { margin-left: 4em; padding-left: 0; }

  /* 편집기 (Quill) 모양을 게시판에 맞춤 */
  /* Quill 기본값(height:100%)이 도구 막대 높이만큼 아래로 넘쳐 첨부 영역을 덮는 문제 수정 */
  .rich-wrap { display: flex; flex-direction: column; min-width: 0; }
  .rich-wrap .ql-container { height: auto !important; }
  .rich-wrap .ql-editor { height: auto !important; overflow-y: visible; }
  .rich-wrap .ql-toolbar.ql-snow { border: 1px solid var(--line); border-radius: 4px 4px 0 0; background: var(--ivory); font-family: var(--sans); padding: 6px 8px; }
  .rich-wrap .ql-container.ql-snow { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 4px 4px; background: #fff; font-family: var(--sans); font-size: 17px; }
  .rich-wrap .ql-editor { min-height: 340px; max-height: none; line-height: 1.65; padding: 16px 18px; word-break: keep-all; }
  .rich-wrap .ql-editor.ql-blank::before { font-style: normal; color: #9AA0A4; left: 18px; }
  .rich-wrap .ql-snow .ql-stroke { stroke: var(--ink); }
  .rich-wrap .ql-snow .ql-fill { fill: var(--ink); }
  .rich-wrap .ql-snow button:hover .ql-stroke, .rich-wrap .ql-snow button.ql-active .ql-stroke,
  .rich-wrap .ql-snow .ql-picker-label:hover .ql-stroke, .rich-wrap .ql-snow .ql-picker-label.ql-active .ql-stroke { stroke: var(--teal); }
  .rich-wrap .ql-snow button:hover .ql-fill, .rich-wrap .ql-snow button.ql-active .ql-fill { fill: var(--teal); }
  .rich-wrap .ql-snow.ql-toolbar button.ql-active, .rich-wrap .ql-snow .ql-picker-label.ql-active { color: var(--teal); }
  .rich-wrap .ql-snow .ql-picker { color: var(--ink); }
  .rich-wrap .ql-snow .ql-picker.ql-header { width: 96px; }
  .rich-wrap .ql-snow .ql-picker.ql-size { width: 72px; }
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-label::before,
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-item::before { content: '본문'; }
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="2"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="2"]::before { content: '큰 제목'; }
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="3"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="3"]::before { content: '작은 제목'; }
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-label::before,
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-item::before { content: '보통'; }
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="small"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="small"]::before { content: '작게'; }
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="large"]::before,
  .rich-wrap .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="large"]::before { content: '크게'; }
  .rich-wrap .ql-snow .ql-tooltip { font-family: var(--sans); z-index: 5; }
  .rich-wrap .ql-snow .ql-tooltip::before { content: '링크 주소:'; }
  .rich-wrap .ql-snow .ql-tooltip[data-mode=link]::before { content: '링크 주소 입력:'; }
  .rich-wrap .ql-snow .ql-tooltip a.ql-action::after { content: '수정'; }
  .rich-wrap .ql-snow .ql-tooltip a.ql-remove::before { content: '제거'; }
  .rich-wrap .ql-snow .ql-tooltip.ql-editing a.ql-action::after { content: '저장'; }
  .rich-wrap .ql-snow .ql-editor h2 { font-size: 1.4em; }
  .rich-wrap .ql-snow .ql-editor h3 { font-size: 1.15em; }
  .admin-actions { display: flex; gap: 8px; margin-top: 28px; }

  section.comments { margin-top: 48px; background: var(--surface); border-radius: 6px; padding: 28px 28px 24px; }
  section.comments h3 { font-family: var(--head); font-size: 18px; margin: 0 0 8px; }
  section.comments h3 span { color: var(--coral); }
  .c { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .c-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .c-name { font-weight: 700; }
  .c-body { white-space: pre-wrap; margin-top: 4px; font-size: 17px; }
  .c-head .link { margin-left: auto; }

  form.cform { margin-top: 24px; display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; min-width: 0; }
  input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 11px 14px; background: var(--ivory); font-size: 16px; }
  input:focus, textarea:focus { background: #fff; border-color: var(--teal); outline: none; }
  textarea { resize: vertical; min-height: 96px; }
  .hint { font-size: 14px; color: var(--muted); }
  .form-end { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* 글쓰기 */
  .editor { border-top: 2px solid var(--ink); padding-top: 24px; display: grid; gap: 14px; }
  .editor input, .editor textarea { background: #fff; }
  .editor textarea { min-height: 340px; }
  label.check { display: flex; gap: 8px; align-items: center; font-size: 16px; }
  label.check input { width: auto; accent-color: var(--teal); }

  /* 첨부: 상세 화면 */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 28px; }
  .gallery.single { grid-template-columns: 1fr; }
  .gallery a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .gallery img { display: block; width: 100%; height: 100%; max-height: 640px; object-fit: contain; background: #fff; }
  .gallery:not(.single) img { aspect-ratio: 4 / 3; object-fit: cover; }
  .files { list-style: none; margin: 28px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .files li { border-bottom: 1px solid var(--line); }
  .files a { display: flex; gap: 12px; align-items: baseline; padding: 12px 4px; color: var(--ink); text-decoration: none; }
  .files a:hover .fname { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
  .fname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .fsize { margin-left: auto; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .ftag { font-family: var(--head); font-size: 12px; font-weight: 700; color: var(--teal); border: 1px solid var(--teal); border-radius: 2px; padding: 0 6px; white-space: nowrap; }
  .clip { color: var(--muted); font-size: 14px; font-weight: 500; margin-left: 8px; font-family: var(--sans); }

  /* 첨부: 글쓰기 화면 */
  .drop {
    border: 1.5px dashed var(--line); border-radius: 4px; background: #fff;
    padding: 20px; text-align: center; color: var(--muted); font-size: 15px; cursor: pointer;
  }
  .drop.over { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
  .drop b { color: var(--teal); }
  .att-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .att-list li { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font-size: 15px; }
  .att-list .thumb { width: 44px; height: 44px; flex: none; border-radius: 2px; object-fit: cover; background: var(--ivory); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
  .att-list .fname { flex: 1; font-weight: 500; }
  .att-list .state { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .att-list .state.err { color: var(--coral); }

  footer.site { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }

  dialog { border: 0; border-top: 4px solid var(--teal); border-radius: 4px; padding: 28px; width: min(380px, 90vw); }
  dialog::backdrop { background: rgba(33, 35, 38, .5); }
  dialog h3 { margin: 0 0 16px; font-family: var(--head); }
  dialog .form-end { margin-top: 16px; justify-content: flex-end; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 4px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--coral); }
  .loading { color: var(--muted); padding: 48px 0; text-align: center; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    header.board { padding: 52px 0 40px; margin-bottom: 32px; --staff-gap: 9px; }
    header.board::before { top: calc(52px + 1px); }
    ul.list button { grid-template-columns: 1fr; padding: 18px 2px; }
    .t { font-size: 17px; }
    section.comments { padding: 22px 18px; margin-left: -8px; margin-right: -8px; }
    .row { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <p class="en">Music Mentoring</p>
    <h1>K예술영재 프로젝트 음악분야 멘토링 게시판</h1>
    <p>멘토링 공지를 확인하고, 궁금한 점은 댓글로 남겨 주세요.</p>
  </div>
</header>

<main class="wrap">
  <div id="view"><div class="loading">불러오는 중…</div></div>
  <footer class="site"><span>2026 K예술영재 프로젝트<br>주관 한국예술영재교육연구원</span><button class="link" id="adminToggle">관리자 로그인</button></footer>
</main>

<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <h3>관리자 로그인</h3>
    <input type="password" id="adminPw" placeholder="관리자 비밀번호" autocomplete="current-password" required>
    <div class="form-end">
      <button type="button" class="btn" id="loginCancel">취소</button>
      <button type="submit" class="btn primary">로그인</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ▼ Apps Script 웹 앱 배포 URL (/exec 로 끝나는 주소)
  const API_URL = 'https://script.google.com/macros/s/AKfycbyKy7L_gF2zx7aDG-lTjzyWQFxlenM27x0YPEGRskSGUyyPiubeagrzNB8Pjp2saVee4g/exec';

  // 관리자 토큰은 메모리에만 보관 → 새로고침하면 다시 로그인
  let adminToken = null;
  let current = { view: 'list', postId: null };

  const $ = (s) => document.querySelector(s);
  const view = $('#view');

  // text/plain으로 보내야 CORS 사전 요청(preflight) 없이 Apps Script에 전달됩니다
  async function api(action, ...args) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, args }),
      });
    } catch (e) {
      throw new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');
    }
    let json;
    try { json = await res.json(); }
    catch (e) { throw new Error('서버 응답을 읽을 수 없습니다. 배포 설정(액세스: 모든 사용자)을 확인해 주세요.'); }
    if (!json.ok) throw new Error(json.error || '요청을 처리하지 못했습니다.');
    return json.data;
  }

  function el(tag, props = {}, ...children) {
    const n = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else if (v !== false && v != null) n.setAttribute(k, v);
    });
    children.flat().forEach((c) => c != null && n.append(c.nodeType ? c : document.createTextNode(c)));
    return n;
  }

  let toastTimer;
  function toast(msg, isErr) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = 'toast'), 2600);
  }

  function fmt(s) { return s ? s.slice(0, 16).replace(/-/g, '.') : ''; }

  function handleErr(e) {
    toast(e.message, true);
    if (/로그인이 만료/.test(e.message)) setAdmin(null);
  }

  function setAdmin(token) {
    adminToken = token;
    $('#adminToggle').textContent = token ? '관리자 로그아웃' : '관리자 로그인';
    render();
  }

  /* ───── 목록 ───── */
  async function showList() {
    current = { view: 'list', postId: null };
    view.replaceChildren(el('div', { class: 'loading' }, '불러오는 중…'));
    try {
      const posts = await api('getPosts');
      if (current.view !== 'list') return;
      const toolbar = el('div', { class: 'toolbar' },
        el('span', { class: 'count' }, '전체 ', el('b', {}, String(posts.length)), '개'),
        adminToken ? el('button', { class: 'btn primary', onclick: () => showEditor() }, '글쓰기') : null
      );
      const body = posts.length
        ? el('ul', { class: 'list' }, posts.map((p) =>
            el('li', {}, el('button', { onclick: () => showPost(p.id) },
              el('span', { class: 't' }, p.pinned ? el('span', { class: 'pin' }, '고정') : null, p.title,
                p.fileCount ? el('span', { class: 'clip' }, `첨부 ${p.fileCount}`) : null),
              el('span', { class: 'cc' }, p.commentCount ? `댓글 ${p.commentCount}` : ''),
              el('span', { class: 'meta' }, fmt(p.createdAt))
            ))))
        : el('div', { class: 'empty' }, adminToken ? '아직 글이 없습니다. 첫 글을 작성해 보세요.' : '아직 등록된 글이 없습니다.');
      view.replaceChildren(toolbar, body);
    } catch (e) { handleErr(e); }
  }

  /* ───── 상세 + 댓글 ───── */
  async function showPost(id, data) {
    current = { view: 'post', postId: id };
    if (!data) view.replaceChildren(el('div', { class: 'loading' }, '불러오는 중…'));
    try {
      const p = data || await api('getPost', id);
      renderPost(p);
      window.scrollTo(0, 0);
    } catch (e) { handleErr(e); showList(); }
  }

  function renderPost(p) {
    const back = el('div', { class: 'toolbar' }, el('button', { class: 'btn', onclick: showList }, '목록으로'));

    const art = el('article', {},
      el('h2', {}, p.pinned ? el('span', { class: 'pin' }, '고정') : null, p.title),
      el('div', { class: 'meta' }, fmt(p.createdAt) + (p.updatedAt ? ` (수정 ${fmt(p.updatedAt)})` : '')),
      renderBody(p.content),
      renderAttachments(p.attachments || []),
      adminToken ? el('div', { class: 'admin-actions' },
        el('button', { class: 'btn', onclick: () => showEditor(p) }, '수정'),
        el('button', { class: 'btn danger', onclick: () => removePost(p.id) }, '삭제')
      ) : null
    );

    const list = p.comments.map((c) =>
      el('div', { class: 'c' },
        el('div', { class: 'c-head' },
          el('span', { class: 'c-name' }, c.name),
          el('span', { class: 'meta' }, fmt(c.createdAt)),
          el('button', { class: 'link danger', onclick: () => removeComment(c.id) }, '삭제')
        ),
        el('div', { class: 'c-body' }, c.content)
      ));

    const form = el('form', { class: 'cform', onsubmit: (ev) => submitComment(ev, p.id) },
      el('div', { class: 'row' },
        el('input', { name: 'name', placeholder: '이름', maxlength: 20, required: true, autocomplete: 'name' }),
        el('input', { name: 'pw', type: 'password', inputmode: 'numeric', pattern: '\\d{4}', maxlength: 4, placeholder: '비밀번호 4자리', required: true })
      ),
      el('textarea', { name: 'content', placeholder: '댓글을 입력하세요', maxlength: 1000, required: true }),
      el('div', { class: 'form-end' },
        el('span', { class: 'hint' }, '비밀번호는 내 댓글을 삭제할 때 필요합니다.'),
        el('button', { class: 'btn primary', type: 'submit' }, '댓글 등록')
      )
    );

    const sec = el('section', { class: 'comments' },
      el('h3', {}, '댓글 ', el('span', {}, String(p.comments.length))),
      list.length ? list : el('p', { class: 'meta' }, '첫 댓글을 남겨 보세요.'),
      form
    );

    view.replaceChildren(back, art, sec);
  }

  /* ───── 서식 본문 ───── */
  // 서식 편집기로 쓴 글은 HTML, 예전 글은 일반 텍스트
  const isHtml = (s) => /^\s*<(p|h[1-6]|ol|ul|blockquote|pre|div)[\s>]/i.test(s || '');

  function renderBody(content) {
    if (!isHtml(content) || !window.DOMPurify) {
      return el('div', { class: 'body plain' }, isHtml(content) ? stripTags(content) : content);
    }
    const div = el('div', { class: 'body rich' });
    div.innerHTML = DOMPurify.sanitize(content, {
      ALLOWED_TAGS: ['p', 'br', 'h2', 'h3', 'strong', 'b', 'em', 'i', 'u', 's', 'span', 'a', 'ol', 'ul', 'li', 'blockquote'],
      ALLOWED_ATTR: ['href', 'class', 'style'],
    });
    div.querySelectorAll('a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
    return div;
  }

  // DOMParser로 읽으면 스크립트·이미지가 실행되지 않음
  function stripTags(html) {
    const doc = new DOMParser().parseFromString(
      String(html).replace(/<\/(p|h\d|li|blockquote)>/gi, '$&\n'), 'text/html');
    doc.querySelectorAll('script, style').forEach((n) => n.remove());
    return doc.body.textContent.trim();
  }

  const TOOL_TITLES = {
    'ql-header': '문단 종류', 'ql-size': '글자 크기', 'ql-bold': '굵게', 'ql-italic': '기울임',
    'ql-underline': '밑줄', 'ql-strike': '취소선', 'ql-color': '글자색', 'ql-background': '형광펜',
    'ql-list': '목록', 'ql-align': '정렬', 'ql-indent': '들여쓰기', 'ql-blockquote': '인용 상자',
    'ql-link': '링크', 'ql-clean': '서식 지우기',
  };

  function createRichEditor(host) {
    const brand = ['#212326', '#176C86', '#1C6077', '#E84958', '#62686D'];
    const quill = new Quill(host, {
      theme: 'snow',
      placeholder: '내용을 입력하세요',
      formats: ['header', 'size', 'bold', 'italic', 'underline', 'strike', 'color', 'background',
                'list', 'indent', 'align', 'blockquote', 'link'],
      modules: {
        toolbar: [
          [{ header: [2, 3, false] }, { size: ['small', false, 'large'] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ color: brand }, { background: ['#FFE3D9', '#E6F0F3', '#FFF3B0', false] }],
          [{ list: 'ordered' }, { list: 'bullet' }, { indent: '-1' }, { indent: '+1' }],
          [{ align: [] }, 'blockquote', 'link'],
          ['clean'],
        ],
      },
    });
    // 도구 버튼에 한글 설명(마우스를 올리면 표시)
    const bar = host.previousElementSibling;
    if (bar) {
      bar.querySelectorAll('button, .ql-picker').forEach((b) => {
        const cls = [...b.classList].find((c) => TOOL_TITLES[c]);
        if (!cls) return;
        let t = TOOL_TITLES[cls];
        if (cls === 'ql-list') t = b.value === 'ordered' ? '번호 목록' : '글머리 목록';
        if (cls === 'ql-indent') t = b.value === '-1' ? '내어쓰기' : '들여쓰기';
        b.setAttribute('title', t);
        if (b.tagName === 'BUTTON') b.setAttribute('aria-label', t);
      });
    }
    return quill;
  }

  function editorHtml(quill) {
    if (!quill.getText().trim()) return '';
    // Quill 2.0.3은 공백을 &nbsp;로 바꿔 줄바꿈이 어색해지므로 일반 공백으로 되돌림
    return quill.getSemanticHTML().replace(/&nbsp;/g, ' ');
  }

  /* ───── 첨부파일 ───── */
  const imgUrl = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
  const viewUrl = (id) => `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
  const downUrl = (id) => `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`;

  function fsize(n) {
    if (!n) return '';
    if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + 'KB';
    return (n / 1024 / 1024).toFixed(1) + 'MB';
  }
  function ext(name) {
    const m = /\.([a-z0-9]{1,5})$/i.exec(name || '');
    return m ? m[1].toUpperCase() : 'FILE';
  }

  function renderAttachments(list) {
    const imgs = list.filter((a) => a.image);
    const frag = document.createDocumentFragment();
    if (imgs.length) {
      frag.append(el('div', { class: 'gallery' + (imgs.length === 1 ? ' single' : '') },
        imgs.map((a) => el('a', { href: viewUrl(a.id), target: '_blank', rel: 'noopener' },
          el('img', { src: imgUrl(a.id, 1600), alt: a.name, loading: 'lazy' })))));
    }
    // 원본 내려받기 목록 (그림 포함 전체)
    if (list.length) {
      frag.append(el('ul', { class: 'files' }, list.map((a) =>
        el('li', {}, el('a', { href: downUrl(a.id), target: '_blank', rel: 'noopener' },
          el('span', { class: 'ftag' }, ext(a.name)),
          el('span', { class: 'fname' }, a.name),
          el('span', { class: 'fsize' }, fsize(a.size)))))));
    }
    return frag;
  }

  const MAX_FILE_MB = 10;
  const MAX_FILES = 10;

  // 큰 사진은 가로 2000px로 줄여서 업로드 (JPEG·WebP·PNG)
  async function shrinkImage(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5 * 1024 * 1024) return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.type === 'image/png') return file;
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      const blob = await new Promise((r) => c.toBlob(r, type, 0.88));
      if (!blob || blob.size >= file.size) return file;
      const name = type === 'image/jpeg' ? file.name.replace(/\.(png|webp)$/i, '.jpg') : file.name;
      return new File([blob], name, { type });
    } catch (e) { return file; }
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
      r.readAsDataURL(file);
    });
  }

  async function submitComment(ev, postId) {
    ev.preventDefault();
    const f = ev.target;
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      const name = f.elements['name'].value;
      const p = await api('addComment', postId, name, f.elements['content'].value, f.elements['pw'].value);
      renderPost(p);
      document.querySelector('.cform [name=name]').value = name; // 이름은 유지
      toast('댓글을 등록했습니다.');
    } catch (e) { handleErr(e); btn.disabled = false; }
  }

  async function removeComment(id) {
    try {
      let p;
      if (adminToken) {
        if (!confirm('이 댓글을 삭제할까요?')) return;
        p = await api('adminDeleteComment', adminToken, id);
      } else {
        const pw = prompt('댓글 작성 시 입력한 비밀번호 4자리를 입력하세요.');
        if (!pw) return;
        p = await api('deleteOwnComment', id, pw);
      }
      renderPost(p);
      toast('댓글을 삭제했습니다.');
    } catch (e) { handleErr(e); }
  }

  async function removePost(id) {
    if (!confirm('이 글을 삭제할까요? 댓글도 함께 보이지 않게 됩니다.')) return;
    try {
      await api('deletePost', adminToken, id);
      toast('글을 삭제했습니다.');
      showList();
    } catch (e) { handleErr(e); }
  }

  /* ───── 글쓰기 / 수정 (관리자) ───── */
  function showEditor(p = null) {
    current = { view: 'editor', postId: p && p.id };
    // 첨부 목록: 업로드 완료된 항목은 meta를 가짐
    const items = (p && p.attachments || []).map((a) => ({ meta: a, state: 'done' }));
    let uploading = 0;

    const listEl = el('ul', { class: 'att-list' });
    const fileInput = el('input', { type: 'file', multiple: true, hidden: true });
    const drop = el('div', { class: 'drop', tabindex: '0', role: 'button' },
      el('b', {}, '파일 선택'), ' 또는 여기로 끌어다 놓기. 그림, 문서, 악보 모두 가능 (파일당 ' + MAX_FILE_MB + 'MB, 최대 ' + MAX_FILES + '개)');

    function drawList() {
      listEl.replaceChildren(...items.map((it) => {
        const name = it.meta ? it.meta.name : it.file.name;
        const isImg = it.meta ? it.meta.image : /^image\//.test(it.file.type);
        const thumb = isImg && (it.preview || (it.meta && imgUrl(it.meta.id, 120)))
          ? el('img', { class: 'thumb', src: it.preview || imgUrl(it.meta.id, 120), alt: '' })
          : el('span', { class: 'thumb' }, ext(name));
        const state = it.state === 'uploading' ? '올리는 중…'
          : it.state === 'error' ? it.error
          : fsize(it.meta && it.meta.size);
        return el('li', {}, thumb,
          el('span', { class: 'fname' }, name),
          el('span', { class: 'state' + (it.state === 'error' ? ' err' : '') }, state),
          it.state === 'uploading' ? null :
            el('button', { type: 'button', class: 'link danger', onclick: () => {
              items.splice(items.indexOf(it), 1);
              if (it.preview) URL.revokeObjectURL(it.preview);
              drawList();
            } }, '빼기'));
      }));
      submitBtn.disabled = uploading > 0;
      submitBtn.textContent = uploading > 0 ? '파일 올리는 중…' : (p ? '수정 완료' : '등록');
    }

    async function addFiles(fileList) {
      for (const raw of Array.from(fileList)) {
        if (items.length >= MAX_FILES) { toast(`첨부파일은 ${MAX_FILES}개까지 올릴 수 있습니다.`, true); break; }
        const it = { file: raw, state: 'uploading' };
        if (/^image\//.test(raw.type)) it.preview = URL.createObjectURL(raw);
        items.push(it);
        uploading++;
        drawList();
        try {
          const file = await shrinkImage(raw);
          if (file.size > MAX_FILE_MB * 1024 * 1024) throw new Error(`${MAX_FILE_MB}MB 초과`);
          const b64 = await toBase64(file);
          it.meta = await api('uploadFile', adminToken, file.name, file.type, b64);
          it.state = 'done';
        } catch (e) {
          it.state = 'error';
          it.error = e.message.length > 20 ? '업로드 실패' : e.message;
          if (/로그인이 만료/.test(e.message)) handleErr(e);
        }
        uploading--;
        drawList();
      }
    }

    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });

    const submitBtn = el('button', { type: 'submit', class: 'btn primary' }, p ? '수정 완료' : '등록');

    // 서식 편집기 (불러오기에 실패하면 일반 입력칸으로 대체)
    const useRich = !!window.Quill;
    const richHost = el('div');
    const plainBox = el('textarea', { name: 'content', placeholder: '내용', maxlength: 10000 });
    const contentBox = useRich ? el('div', { class: 'rich-wrap' }, richHost) : plainBox;
    let quill = null;

    const form = el('form', { class: 'editor', onsubmit: async (ev) => {
        ev.preventDefault();
        if (uploading > 0) return;
        if (items.some((it) => it.state === 'error') &&
            !confirm('올리지 못한 파일이 있습니다. 그 파일은 빼고 등록할까요?')) return;
        const content = quill ? editorHtml(quill) : plainBox.value.trim();
        if (!content) { toast('내용을 입력해 주세요.', true); (quill || plainBox).focus(); return; }
        submitBtn.disabled = true;
        try {
          const id = await api('savePost', adminToken, {
            id: p && p.id,
            title: form.elements['title'].value,
            content,
            pinned: form.elements['pinned'].checked,
            attachments: items.filter((it) => it.state === 'done').map((it) => it.meta),
          });
          toast(p ? '글을 수정했습니다.' : '글을 등록했습니다.');
          showPost(id);
        } catch (e) { handleErr(e); submitBtn.disabled = false; }
      } },
      el('input', { name: 'title', placeholder: '제목', maxlength: 100, required: true }),
      contentBox,
      drop, fileInput, listEl,
      el('label', { class: 'check' }, el('input', { type: 'checkbox', name: 'pinned' }), '목록 맨 위에 고정'),
      el('div', { class: 'form-end' },
        el('button', { type: 'button', class: 'btn', onclick: () => (p ? showPost(p.id) : showList()) }, '취소'),
        submitBtn
      )
    );
    view.replaceChildren(el('div', { class: 'toolbar' }, el('strong', {}, p ? '글 수정' : '새 글 작성')), form);
    if (useRich) quill = createRichEditor(richHost);
    if (p) {
      form.elements['title'].value = p.title;
      form.elements['pinned'].checked = p.pinned;
      if (quill) {
        if (isHtml(p.content)) quill.clipboard.dangerouslyPasteHTML(window.DOMPurify ? DOMPurify.sanitize(p.content) : p.content);
        else quill.setText(p.content);
      } else {
        plainBox.value = isHtml(p.content) ? stripTags(p.content) : p.content;
      }
    }
    drawList();
    form.elements['title'].focus();
  }

  function render() {
    if (current.view === 'post') showPost(current.postId);
    else if (current.view === 'list') showList();
    else if (!adminToken) showList();
  }

  /* ───── 관리자 로그인 ───── */
  const dlg = $('#loginDlg');
  $('#adminToggle').addEventListener('click', async () => {
    if (adminToken) {
      api('adminLogout', adminToken).catch(() => {});
      setAdmin(null);
      toast('로그아웃했습니다.');
    } else {
      $('#adminPw').value = '';
      dlg.showModal();
    }
  });
  $('#loginCancel').addEventListener('click', () => dlg.close());
  $('#loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    try {
      const token = await api('adminLogin', $('#adminPw').value);
      dlg.close();
      setAdmin(token);
      toast('관리자로 로그인했습니다.');
    } catch (e) { toast(e.message, true); }
  });

  showList();
</script>
</body>
</html>
