<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  @font-face { font-family: 'Paperlogy'; font-weight: 500; font-display: swap;

  @font-face { font-family: 'Paperlogy'; font-weight: 800; font-display: swap;
    src: local('페이퍼로지 8 ExtraBold'), local('Paperlogy-8ExtraBold'), url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2'); }

  :root {
    --teal: #176C86; --teal-deep: #1C6077; --ivory: #FAF9F5; --ink: #212326; --coral: #E84958; --apricot: #FFB098;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ivory); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  .bar .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; }

  .bar a, .bar button { color: #fff; background: none; border: 1px solid rgba(255,255,255,.5); border-radius: 4px; padding: 6px 12px; font-size: 14px; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .bar a:hover, .bar button:hover { background: rgba(255,255,255,.12); }

  .btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: var(--teal); color: var(--teal); }

  /* 요약 타일 */

  .stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; }
  .stat .v { font-family: var(--head); font-weight: 800; font-size: 34px; line-height: 1; color: var(--teal-deep); }
  .stat .v small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .stat .l { font-size: 14px; color: var(--muted); }
  .stat .l b { display: block; color: var(--ink); font-size: 15px; font-family: var(--head); margin-bottom: 2px; }
  .ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: conic-gradient(var(--teal) calc(var(--p) * 1%), var(--teal-soft) 0); }

  /* 탭 */

  .pane { background: #fff; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; padding: 24px; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }

  th, td { border-bottom: 1px solid var(--line); padding: 10px 10px; text-align: left; vertical-align: top; }

  td.nw { white-space: nowrap; }

  .tag.no { background: #F3F1EC; color: var(--muted); }
  .tag.etc { background: #FCE3E5; color: #A42836; }
  .ttl { font-weight: 600; color: var(--ink); text-decoration: none; }
  .ttl:hover { color: var(--teal); text-decoration: underline; }
  .acts { display: flex; gap: 6px; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  .pinbtn.on { background: var(--apricot); border-color: var(--apricot); color: var(--ink); }

  /* 희망곡 현황 */

  .progress .fill { height: 100%; background: var(--teal); border-radius: 6px; }
  .progress b { font-family: var(--head); font-size: 20px; color: var(--teal-deep); white-space: nowrap; }
  .progress .miss { font-size: 14px; color: var(--muted); }
  .progress .miss em { font-style: normal; color: var(--coral); font-weight: 600; }
  .ens-title { font-family: var(--head); font-size: 17px; margin: 24px 0 10px; display: flex; align-items: center; gap: 10px; }
  .ens-title::before { content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--teal); }
  .ens-title span { font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--muted); }
  table.wtbl { table-layout: fixed; min-width: 720px; }
  table.wtbl th:nth-child(1) { width: 14%; } table.wtbl th:nth-child(2) { width: 24%; }
  table.wtbl th:nth-child(3) { width: 48%; } table.wtbl th:nth-child(4) { width: 14%; }
  .members { display: flex; gap: 4px; flex-wrap: wrap; }
  .members span { background: var(--teal-soft); border-radius: 6px; padding: 1px 8px; font-size: 13px; white-space: nowrap; }
  .members span.dup { background: #FCE3E5; }
  .members span.dup b { color: var(--coral); margin-left: 1px; }
  .dup-box { border: 1px solid #F4C4C9; background: #FFF6F6; border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 14px; }
  .dup-box h4 { margin: 0 0 8px; font-family: var(--head); font-size: 15px; color: #A42836; }
  .dup-box ul { margin: 0; padding-left: 18px; }
  .wlist { display: grid; gap: 4px; }
  .wlist div { display: flex; gap: 8px; align-items: baseline; }
  .wlist .s { flex: 1; min-width: 0; }
  .wlist .who { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .xdel { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; }
  .xdel:hover { color: var(--coral); }
  .tally { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 28px; }
  .tally-box { border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
  .tally-box h4 { margin: 0 0 12px; font-family: var(--head); font-size: 15px; }
  .hbar { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 4px 10px; align-items: center; font-size: 13px; margin-bottom: 8px; }
  .hbar .name { grid-column: 1 / -1; line-height: 1.4; }
  .hbar .b { height: 10px; background: var(--teal-soft); border-radius: 5px; overflow: hidden; }
  .hbar .b i { display: block; height: 100%; background: var(--teal); border-radius: 5px; }
  .hbar .c { font-family: var(--head); font-weight: 700; text-align: right; }

  /* 팀 편성 관리 */
  .tstate { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--ivory); border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; font-size: 14px; }
  .tstate b { font-family: var(--head); font-size: 16px; }
  .tstate .sp { flex: 1; }
  .tag.inh { background: #F3F1EC; color: var(--muted); }
  table.tedit { table-layout: fixed; min-width: 880px; }
  table.tedit th:nth-child(1) { width: 15%; } table.tedit th:nth-child(2) { width: 13%; } table.tedit th:nth-child(3) { width: 34%; }
  table.tedit th:nth-child(4) { width: 30%; } table.tedit th:nth-child(5) { width: 8%; }
  table.tedit td { padding: 6px; vertical-align: top; }
  table.tedit.nosong th:nth-child(1) { width: 17%; } table.tedit.nosong th:nth-child(2) { width: 14%; } table.tedit.nosong th:nth-child(3) { width: 45%; }
  table.tedit.nosong th:nth-child(4) { width: 16%; } table.tedit.nosong th:nth-child(5) { width: 8%; }
  table.tedit.wish th:nth-child(1) { width: 13%; } table.tedit.wish th:nth-child(2) { width: 11%; } table.tedit.wish th:nth-child(3) { width: 30%; }
  table.tedit.wish th:nth-child(4) { width: 25%; } table.tedit.wish th:nth-child(5) { width: 14%; } table.tedit.wish th:nth-child(6) { width: 7%; }
  table.tedit textarea { width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid var(--line); border-radius: 4px; resize: vertical; font-family: inherit; line-height: 1.5; }
  table.tedit textarea.changed { border-color: var(--coral); background: #FFF6F6; }
  .allow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding-top: 8px; cursor: pointer; }
  .allow input { width: auto !important; accent-color: var(--teal); }
  table.tedit input { width: 100%; padding: 7px 9px; font-size: 14px; }
  table.tedit input.changed { border-color: var(--coral); background: #FFF6F6; }
  .editbar { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .editbar .sp { flex: 1; }
  .dirty { color: var(--coral); font-size: 14px; font-weight: 600; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.6; }

  /* 지정곡 관리 */
  .songcards { display: grid; gap: 12px; }
  .sc { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; background: #fff; }
  .sc-row1 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) auto; gap: 10px; align-items: end; }
  .sc-row2 { display: grid; grid-template-columns: auto minmax(160px, 220px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .sc .grp { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .sc .boxes { display: flex; gap: 6px; flex-wrap: wrap; }
  .sc .boxes label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .sc .boxes label:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
  .sc .boxes input { accent-color: var(--teal); margin: 0; }
  .sc .scope { font-size: 13px; color: var(--teal-deep); background: var(--teal-soft); border-radius: 4px; padding: 6px 10px; }
  .sc.changed { border-color: var(--coral); }
  .preview { margin-top: 24px; }
  .preview h4 { font-family: var(--head); font-size: 15px; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .preview td .none { color: var(--muted); }
  .preview td ul { margin: 0; padding-left: 16px; }
  @media (max-width: 900px) { .sc-row1, .sc-row2 { grid-template-columns: 1fr; } }

  /* 일정 관리 */
  .sched { display: grid; gap: 16px; }
  .scard { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .scard-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: var(--teal-deep); color: #fff; flex-wrap: wrap; }
  .scard-top .rn { font-family: var(--head); font-weight: 800; font-size: 22px; color: var(--apricot); }
  .scard-top b { font-family: var(--head); font-size: 17px; }
  .scard-top .sum { font-size: 13px; opacity: .85; margin-left: auto; }
  .scard-body { padding: 16px 18px; display: grid; gap: 14px; }
  .sgrid { display: grid; grid-template-columns: 2fr 2fr 1fr 2fr; gap: 10px; }
  .sgrid2 { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; }
  .fl { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .fl input, .fl select, .fl textarea { font-size: 14px; color: var(--ink); font-weight: 400; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: #fff; width: 100%; }
  .fl textarea { min-height: 54px; resize: vertical; font-family: inherit; }
  .ms-title { font-family: var(--head); font-size: 14px; margin: 4px 0 0; }
  table.ms { table-layout: fixed; min-width: 760px; }
  table.ms th:nth-child(1) { width: 17%; } table.ms th:nth-child(2) { width: 17%; } table.ms th:nth-child(3) { width: 17%; }
  table.ms th:nth-child(4) { width: 41%; } table.ms th:nth-child(5) { width: 8%; }
  table.ms td { padding: 5px 6px; }
  table.ms input, table.ms select { width: 100%; padding: 6px 8px; font-size: 14px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  table.ms tr.ev td { background: #F4F9FA; }
  .changed { border-color: var(--coral) !important; background: #FFF6F6 !important; }
  .sticky-save { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); margin: 20px -24px -24px; padding: 14px 24px; display: flex; gap: 10px; align-items: center; border-radius: 0 0 8px 8px; }
  .sticky-save .sp { flex: 1; }
  @media (max-width: 900px) { .sgrid, .sgrid2 { grid-template-columns: 1fr 1fr; } }

  /* 참가 신청 */
  .app-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
  .box h4 { margin: 0 0 12px; font-family: var(--head); font-size: 15px; }
  .big { font-family: var(--head); font-weight: 800; font-size: 44px; line-height: 1; color: var(--teal-deep); }
  .big small { font-size: 18px; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .search { min-width: 200px; }
  td.msg { min-width: 220px; white-space: pre-wrap; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 4px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--coral); }
  .loading { color: var(--muted); text-align: center; padding: 60px 0; }

  @media (max-width: 900px) {
    .stats, .app-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 14px; }
    .stats, .app-grid { grid-template-columns: 1fr; }
    .pane { padding: 16px 12px; }
    .tab { padding: 10px 12px; font-size: 15px; }
    .bar h1 small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <h1>음악분야 멘토링 관리자<small>K예술영재 프로젝트</small></h1>
    <a href="index.html" target="_blank" rel="noopener">게시판 보기</a>
    <button type="button" id="logoutBtn" hidden>로그아웃</button>
  </div>
</header>

<div id="app" class="wrap"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ▼ 게시판(index.html)과 같은 Apps Script 웹 앱 주소
  const API_URL = 'https://script.google.com/macros/s/AKfycbyKy7L_gF2zx7aDG-lTjzyWQFxlenM27x0YPEGRskSGUyyPiubeagrzNB8Pjp2saVee4g/exec';

  // 로그인 정보는 메모리에만 보관 → 새로고침하거나 다시 접속하면 비밀번호를 다시 입력
  let token = null;
  let board = null, apps = [];
  let tab = 'posts', postFilter = 'all', appSession = null, appQuery = '';
  let teamSession = null, teamDraft = null, teamDirty = false;   // 팀 편성 관리
  let sched = null, schedDirty = false;                            // 일정 관리
  let songDraft = null, songDirty = false, songView = null;         // 지정곡 관리

  const $ = (s) => document.querySelector(s);
  const app = $('#app');

  async function api(action, ...args) {
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, args }) });
    } catch (e) { throw new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.'); }
    let json;
    try { json = await res.json(); } catch (e) { throw new Error('서버 응답을 읽을 수 없습니다.'); }
    if (!json.ok) throw new Error(json.error || '요청을 처리하지 못했습니다.');
    return json.data;
  }

  function el(tag, props = {}, ...children) {
    const n = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === 'class') n.className = v;
      else if (k === 'style' && typeof v === 'string') n.setAttribute('style', v);
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else if (v !== false && v != null) n.setAttribute(k, v);
    });
    children.flat().forEach((c) => c != null && c !== false && n.append(c.nodeType ? c : document.createTextNode(c)));
    return n;
  }

  let toastTimer;
  function toast(msg, err) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = 'toast'), 2800);
  }
  function fail(e) {
    toast(e.message, true);
    if (/로그인이 만료/.test(e.message)) { token = null; showLogin(); }
  }

  const fmt = (s) => (s ? s.slice(0, 16).replace(/-/g, '.') : '');
  const sessionTitle = (no) => { const s = board && board.sessions.find((x) => x.no === no); return s ? `${no}회 ${s.title}` : (no ? `${no}회` : '공통'); };

  function csvDownload(name, header, rows) {
    const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const text = [header, ...rows].map((r) => r.map(esc).join(',')).join('\r\n');
    const a = el('a', { href: URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv' })), download: name });
    document.body.append(a); a.click(); a.remove();
  }

  // 희망곡을 받는 회차(1회)와 팀 신청 회차(3·4회)
  const wishSessions = () => board.sessions.filter((s) => s.applyType === 'comment').map((s) => s.no);
  const baseTeamSession = () => (board.teams || []).reduce((n, t) => Math.min(n, t.session), 99);
  // 회차별 팀: 전용 편성이 없으면 1회차 편성을 이어받음
  function teamsFor(no) {
    const own = (board.teams || []).filter((t) => t.session === no);
    if (own.length) return own;
    const s = board.sessions.find((x) => x.no === no);
    if (!s || s.applyMode !== 'team') return [];
    return (board.teams || []).filter((t) => t.session === baseTeamSession())
      .map((t) => Object.assign({}, t, { session: no, fixedSong: '', selectedSong: '', wishes: [], inherited: true }));
  }

  /* ───── 로그인 ───── */
  function showLogin() {
    $('#logoutBtn').hidden = true;
    const form = el('form', { class: 'login', onsubmit: async (ev) => {
        ev.preventDefault();
        const btn = form.querySelector('button');
        btn.disabled = true;
        try {
          token = await api('adminLogin', form.elements['pw'].value);
          $('#logoutBtn').hidden = false;
          await loadAll();
        } catch (e) { toast(e.message, true); btn.disabled = false; }
      } },
      el('h2', {}, '관리자 로그인'),
      el('p', {}, '관리자 비밀번호를 입력하세요. 보안을 위해 다시 접속하면 비밀번호를 새로 입력해야 합니다.'),
      el('input', { type: 'password', name: 'pw', placeholder: '관리자 비밀번호', autocomplete: 'current-password', required: true }),
      el('button', { class: 'btn primary', type: 'submit' }, '로그인'));
    app.replaceChildren(form);
    form.elements['pw'].focus();
  }
  $('#logoutBtn').addEventListener('click', () => {
    api('adminLogout', token).catch(() => {});
    token = null; board = null; apps = [];
    showLogin(); toast('로그아웃했습니다.');
  });

  async function loadAll() {
    app.replaceChildren(el('div', { class: 'loading' }, '불러오는 중…'));
    try {
      [board, apps] = await Promise.all([api('getBoard'), api('adminGetApplications', token, 0)]);
      teamDraft = null; teamDirty = false; sched = null; schedDirty = false; songDraft = null; songDirty = false;
      const formSessions = board.sessions.filter((s) => s.applyType === 'form');
      if (!appSession || !formSessions.some((s) => s.no === appSession)) appSession = formSessions[0] ? formSessions[0].no : null;
      render();
    } catch (e) { fail(e); }
  }

  /* ───── 화면 ───── */
  function render() {
    const posts = board.posts;
    const teams = (board.teams || []).filter((t) => wishSessions().includes(t.session));
    const wishTeams = teams.filter((t) => t.wishes.length).length;
    const formSessions = board.sessions.filter((s) => s.applyType === 'form');
    const pct = teams.length ? Math.round(wishTeams / teams.length * 100) : 0;

    const stats = el('div', { class: 'stats' },
      el('div', { class: 'stat' },
        el('div', { class: 'v' }, String(posts.length), el('small', {}, '건')),
        el('div', { class: 'l' }, el('b', {}, '게시글'), `공통 ${posts.filter((p) => !p.session).length} · 회차 ${posts.filter((p) => p.session).length}`)),
      el('div', { class: 'stat' },
        el('div', { class: 'v' }, String(posts.reduce((n, p) => n + (p.commentCount || 0), 0)), el('small', {}, '개')),
        el('div', { class: 'l' }, el('b', {}, '댓글'), '전체 글 기준')),
      el('div', { class: 'stat' },
        el('div', { class: 'ring', style: `--p:${pct}` }, el('span', {}, `${pct}%`)),
        el('div', { class: 'l' }, el('b', {}, '희망곡 입력'), `${wishTeams} / ${teams.length}팀 입력`)),
      el('div', { class: 'stat' },
        el('div', { class: 'mini' }, formSessions.map((s) =>
          el('div', {}, el('b', {}, String(apps.filter((a) => a.session === s.no).length)), el('span', {}, `${s.no}회`)))),
        el('div', { class: 'l' }, el('b', {}, '참가 신청'), '회차별 인원')));

    const tabDefs = [['posts', '전체 글 관리', posts.length], ['wishes', '희망곡 현황', teams.length ? `${wishTeams}/${teams.length}` : ''], ['apps', '참가 신청', apps.length], ['teams', '팀 편성 관리', ''], ['songs', '지정곡 관리', (board.songs || []).filter((x) => x.song).length ? String(new Set((board.songs || []).filter((x) => x.song).map((x) => x.song)).size) : ''], ['sched', '일정 관리', '']];
    const tabs = el('div', { class: 'tabs', role: 'tablist' }, tabDefs.map(([k, label, n]) =>
      el('button', { class: 'tab', role: 'tab', 'aria-selected': String(tab === k), onclick: () => {
        if (tab === 'teams' && k !== 'teams' && teamDirty && !confirm('저장하지 않은 팀 편성 변경이 있습니다. 이동할까요?')) return;
        if (tab === 'sched' && k !== 'sched' && schedDirty && !confirm('저장하지 않은 일정 변경이 있습니다. 이동할까요?')) return;
        if (tab === 'songs' && k !== 'songs' && songDirty && !confirm('저장하지 않은 지정곡 변경이 있습니다. 이동할까요?')) return;
        if (k !== 'songs') { songDraft = null; songDirty = false; }
        if (k !== 'teams') { teamDraft = null; teamDirty = false; }
        if (k !== 'sched') { sched = null; schedDirty = false; }
        tab = k; render(); } },
        label, n !== '' ? el('span', { class: 'n' }, String(n)) : null)));

    const pane = el('section', { class: 'pane', role: 'tabpanel' },
      tab === 'posts' ? postsPane() : tab === 'wishes' ? wishesPane() : tab === 'teams' ? teamsPane() : tab === 'songs' ? songsPane() : tab === 'sched' ? schedPane() : appsPane());

    app.replaceChildren(el('main', {}, stats, tabs, pane));
  }

  /* ───── 1. 전체 글 관리 ───── */
  // 글쓰기·수정은 게시판의 편집기에서: 로그인 정보를 한 번만 넘겨주고 이동
  function goEditor(query) {
    localStorage.setItem('mm_admin', JSON.stringify({ token, at: Date.now() }));
    window.open(`index.html?${query}`, '_blank', 'noopener');
  }

  function postsPane() {
    const opts = [['all', '전체'], ['0', '공통']].concat(board.sessions.map((s) => [String(s.no), `${s.no}회`]));
    const list = board.posts.filter((p) => postFilter === 'all' || String(p.session) === postFilter);
    const newSel = el('select', { 'aria-label': '새 글 회차' },
      el('option', { value: '0' }, '공통 공지'),
      board.sessions.map((s) => el('option', { value: String(s.no), selected: postFilter === String(s.no) }, `${s.no}회 ${s.title}`)));

    const tools = el('div', { class: 'tools' },
      el('div', { class: 'chips' }, opts.map(([v, label]) =>
        el('button', { class: 'chip', 'aria-pressed': String(postFilter === v), onclick: () => { postFilter = v; render(); } },
          label, el('span', { class: 'n' }, String(board.posts.filter((p) => v === 'all' || String(p.session) === v).length))))),
      el('span', { class: 'sp' }),
      newSel,
      el('button', { class: 'btn primary', onclick: () => goEditor(`new=${newSel.value}`) }, '새 글 쓰기'),
      el('button', { class: 'btn', onclick: loadAll }, '새로고침'));

    if (!list.length) return [tools, el('div', { class: 'empty' }, '해당하는 글이 없습니다.')];

    const rows = list.map((p) => el('tr', {},
      el('td', {}, el('button', { class: 'pinbtn' + (p.pinned ? ' on' : ''), title: p.pinned ? '고정 해제' : '목록 위에 고정',
        onclick: () => togglePin(p) }, p.pinned ? '고정' : '–')),
      el('td', { class: 'nw' }, el('span', { class: 'tag' }, p.session ? `${p.session}회` : '공통')),
      el('td', {}, el('a', { class: 'ttl', href: `index.html?post=${encodeURIComponent(p.id)}`, target: '_blank', rel: 'noopener' }, p.title)),
      el('td', { class: 'num' }, fmt(p.createdAt)),
      el('td', { class: 'num' }, p.commentCount ? String(p.commentCount) : '–'),
      el('td', { class: 'num' }, p.fileCount ? String(p.fileCount) : '–'),
      el('td', {}, el('div', { class: 'acts' },
        el('button', { class: 'btn sm', onclick: () => goEditor(`edit=${encodeURIComponent(p.id)}`) }, '수정'),
        el('button', { class: 'btn sm danger', onclick: () => removePost(p) }, '삭제')))));

    return [tools, el('div', { class: 'tbl-wrap' }, el('table', {},
      el('thead', {}, el('tr', {}, ['고정', '회차', '제목', '작성일', '댓글', '첨부', ''].map((h) => el('th', {}, h)))),
      el('tbody', {}, rows))),
      el('p', { class: 'sub' }, '글쓰기와 수정은 게시판 편집기가 새 탭으로 열립니다. 저장한 뒤 이 화면에서 새로고침을 누르면 반영돼요.')];
  }

  async function togglePin(p) {
    try { await api('adminSetPinned', token, p.id, !p.pinned); p.pinned = !p.pinned; render(); toast(p.pinned ? '고정했습니다.' : '고정을 해제했습니다.'); }
    catch (e) { fail(e); }
  }
  async function removePost(p) {
    if (!confirm(`"${p.title}" 글을 삭제할까요?`)) return;
    try { await api('deletePost', token, p.id); board.posts = board.posts.filter((x) => x.id !== p.id); render(); toast('삭제했습니다.'); }
    catch (e) { fail(e); }
  }

  /* ───── 2. 희망곡 현황 ───── */
  const songKey = (s) => String(s || '').replace(/^\[(지정곡|기타)\]\s*/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
  const songKind = (s) => (/^\[지정곡\]/.test(s) ? 'fixed' : /^\[기타\]/.test(s) ? 'etc' : 'list');

  function wishesPane() {
    const teams = (board.teams || []).filter((t) => wishSessions().includes(t.session));
    if (!teams.length) return el('div', { class: 'empty' }, 'teams 탭에 팀 편성이 아직 없습니다.');
    const done = teams.filter((t) => t.wishes.length);
    const missing = teams.filter((t) => !t.wishes.length);
    const pct = Math.round(done.length / teams.length * 100);

    const progress = el('div', { class: 'progress' },
      el('b', {}, `${done.length} / ${teams.length}팀`),
      el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${pct}%` })),
      el('div', { class: 'miss' }, missing.length ? ['미입력 ', el('em', {}, missing.map((t) => t.team).join(', '))] : '모든 팀이 입력했습니다'));

    const tools = el('div', { class: 'tools' }, el('span', { class: 'sp' }),
      el('button', { class: 'btn', onclick: () => csvDownload('희망곡_현황.csv',
        ['회차', '편성', '팀', '구성원', '구분', '희망곡', '작성자', '입력 시각'],
        teams.flatMap((t) => (t.wishes.length ? t.wishes : [null]).map((w) => [
          t.session, t.ensemble, t.team, t.members.map((m) => m.name + (isDup(t, m.name) ? '*' : '') + (m.part ? `(${m.part})` : '')).join(', '),
          w ? { fixed: '지정곡', etc: '기타', list: '목록' }[songKind(w.song)] : '미입력', w ? w.song : '', w ? w.name : '', w ? w.createdAt : ''])))
      }, '엑셀(CSV) 내려받기'),
      el('button', { class: 'btn', onclick: loadAll }, '새로고침'));

    // 중복 참여 학생 (같은 회차 두 팀 이상)
    const by = {};
    teams.forEach((t) => new Set(t.members.map((m) => m.name)).forEach((n) => (by[`${t.session}|${n}`] = by[`${t.session}|${n}`] || []).push(t.team)));
    const dups = Object.entries(by).filter(([, ts]) => ts.length > 1);
    const isDup = (t, n) => (by[`${t.session}|${n}`] || []).length > 1;
    const dupBox = dups.length ? el('div', { class: 'dup-box' },
      el('h4', {}, `중복 참여 학생 ${dups.length}명 (이름 옆 * 표시)`),
      el('ul', {}, dups.map(([k, ts]) => el('li', {}, el('b', {}, k.split('|')[1]), ` — ${ts.join(', ')}`)))) : null;

    // 편성별 표
    const groups = [];
    teams.forEach((t) => { let g = groups.find((x) => x.name === t.ensemble); if (!g) groups.push(g = { name: t.ensemble, teams: [] }); g.teams.push(t); });
    const tables = groups.map((g) => [
      el('h3', { class: 'ens-title' }, g.name, el('span', {}, `${g.teams.filter((t) => t.wishes.length).length} / ${g.teams.length}팀 입력`)),
      el('div', { class: 'tbl-wrap' }, el('table', { class: 'wtbl' },
        el('thead', {}, el('tr', {}, ['팀', '구성원', '희망곡', '상태'].map((h) => el('th', {}, h)))),
        el('tbody', {}, g.teams.map((t) => el('tr', {},
          el('td', { class: 'nw' }, el('b', {}, t.team)),
          el('td', {}, el('div', { class: 'members' }, t.members.map((m) => isDup(t, m.name)
            ? el('span', { class: 'dup', title: `중복 참여: ${by[`${t.session}|${m.name}`].join(', ')}` }, m.name, el('b', {}, '*'))
            : el('span', {}, m.name)))),
          el('td', {}, t.wishes.length ? el('div', { class: 'wlist' }, t.wishes.map((w) => el('div', {},
              el('span', { class: 's' }, w.song),
              el('span', { class: 'who' }, `${w.name} · ${fmt(w.createdAt)}`),
              el('button', { class: 'xdel', onclick: () => removeWish(w) }, '삭제'))))
            : el('span', { style: 'color:var(--muted)' }, '–')),
          el('td', { class: 'nw' }, statusTag(t)))))))]);

    // 많이 고른 곡
    const tally = groups.map((g) => {
      const count = {};
      g.teams.forEach((t) => new Set(t.wishes.map((w) => songKey(w.song))).forEach((k) => (count[k] = (count[k] || 0) + 1)));
      const top = Object.entries(count).sort((a, b) => b[1] - a[1]);
      if (!top.length) return null;
      const max = top[0][1];
      return el('div', { class: 'tally-box' }, el('h4', {}, `${g.name} · 팀별 희망곡 집계`),
        top.map(([name, n]) => el('div', { class: 'hbar' }, el('span', { class: 'name' }, name),
          el('span', { class: 'b' }, el('i', { style: `width:${n / max * 100}%` })), el('span', { class: 'c' }, `${n}팀`))));
    }).filter(Boolean);

    return [progress, dupBox, tools, ...tables.flat(), tally.length ? el('div', { class: 'tally' }, tally) : null];
  }

  function statusTag(t) {
    if (t.selectedSong) return el('span', { class: 'tag ok' }, '확정');
    if (!t.wishes.length) return el('span', { class: 'tag no' }, '미입력');
    const kinds = new Set(t.wishes.map((w) => songKind(w.song)));
    if (kinds.has('fixed') && kinds.size === 1) return el('span', { class: 'tag' }, '지정곡 선택');
    if (kinds.has('etc')) return el('span', { class: 'tag etc' }, '기타 포함');
    return el('span', { class: 'tag' }, '입력 완료');
  }

  async function removeWish(w) {
    if (!confirm(`"${w.song}" 희망곡을 삭제할까요?`)) return;
    try {
      const updated = await api('adminDeleteTeamWish', token, w.id);
      const no = updated[0] ? updated[0].session : null;
      board.teams = board.teams.filter((t) => t.session !== no).concat(updated);
      render(); toast('삭제했습니다.');
    } catch (e) { fail(e); }
  }

  /* ───── 3. 참가 신청 ───── */
  function countBy(list, key) {
    const c = {};
    list.forEach((a) => { const k = String(a[key] || '').trim() || '미기재'; c[k] = (c[k] || 0) + 1; });
    return Object.entries(c).sort((a, b) => b[1] - a[1]);
  }
  function bars(entries) {
    if (!entries.length) return el('div', { class: 'sub' }, '신청자가 없습니다.');
    const max = entries[0][1];
    return entries.slice(0, 8).map(([k, n]) => el('div', { class: 'hbar' }, el('span', { class: 'name' }, k),
      el('span', { class: 'b' }, el('i', { style: `width:${n / max * 100}%` })), el('span', { class: 'c' }, `${n}명`)));
  }

  function appsPane() {
    const formSessions = board.sessions.filter((s) => s.applyType === 'form');
    if (!formSessions.length) return el('div', { class: 'empty' }, '신청을 받는 회차가 없습니다.');
    const s = formSessions.find((x) => x.no === appSession) || formSessions[0];
    const team = s.applyMode === 'team';
    const unit = team ? '팀' : '명';
    const all = apps.filter((a) => a.session === s.no);
    const q = appQuery.trim();
    const list = q ? all.filter((a) => [a.name, a.team, a.ensemble, a.members, a.song].some((v) => String(v || '').includes(q))) : all;
    const yes = all.filter((a) => a.attend === '참여');
    const no = all.filter((a) => a.attend === '불참');
    const d = (x) => (x ? x.slice(5).replace('-', '/') : '');

    const chips = el('div', { class: 'chips' }, formSessions.map((x) =>
      el('button', { class: 'chip', 'aria-pressed': String(x.no === s.no), onclick: () => { appSession = x.no; appQuery = ''; render(); } },
        `${x.no}회 ${x.title}`, el('span', { class: 'n' }, String(apps.filter((a) => a.session === x.no).length)))));

    const search = el('input', { class: 'search', type: 'search', placeholder: team ? '신청자·팀·팀원·곡 검색' : '이름·곡 검색', value: appQuery });
    search.addEventListener('input', () => { appQuery = search.value; const pos = search.selectionStart; render(); const n = document.querySelector('.search'); n.focus(); n.setSelectionRange(pos, pos); });

    const header = team ? ['번호', '접수 시각', '신청자', '실내악 편성', '팀', '팀원', '참여 여부', '레슨 곡목']
                        : ['번호', '접수 시각', '이름', '참여 여부', '레슨 곡목'];
    const rowOf = (a, i) => team ? [i + 1, a.updatedAt || a.createdAt, a.name, a.ensemble, a.team, a.members, a.attend, a.song]
                                 : [i + 1, a.updatedAt || a.createdAt, a.name, a.attend, a.song];

    const tools = el('div', { class: 'tools' }, chips, el('span', { class: 'sp' }), search,
      el('button', { class: 'btn', disabled: !all.length, onclick: () => csvDownload(`${s.no}회_${s.title}_신청.csv`, header, all.map(rowOf)) }, '엑셀(CSV) 내려받기'),
      el('button', { class: 'btn', onclick: loadAll }, '새로고침'));

    // 팀 신청: 1회차 팀 중 아직 신청하지 않은 팀
    const rosterTeams = teamsFor(s.no);
    const appliedTeams = new Set(all.map((a) => a.team).filter(Boolean));
    const notYet = team ? rosterTeams.filter((t) => !appliedTeams.has(t.team)) : [];
    const people = team ? yes.reduce((n, a) => n + String(a.members || '').split(/[,，]/).filter((x) => x.trim()).length, 0) : yes.length;

    const summary = el('div', { class: 'app-grid' },
      el('div', { class: 'box' }, el('h4', {}, `신청 ${unit}`),
        el('div', { class: 'big' }, String(all.length), el('small', {}, unit)),
        el('div', { class: 'sub' }, `신청 기간 ${d(s.applyStart)} ~ ${d(s.applyEnd)} · 진행 ${d(s.date)}`)),
      el('div', { class: 'box' }, el('h4', {}, '참여 여부'),
        el('div', { class: 'mini', style: 'margin-bottom:8px' },
          el('div', {}, el('b', {}, String(yes.length)), el('span', {}, `참여 ${unit}`)),
          el('div', {}, el('b', { style: 'color:var(--coral)' }, String(no.length)), el('span', {}, `불참 ${unit}`)),
          team ? el('div', {}, el('b', {}, String(people)), el('span', {}, '참여 인원')) : null),
        no.length ? el('div', { class: 'sub' }, `불참: ${no.map((a) => a.team || a.name).join(', ')}`) : null),
      team
        ? el('div', { class: 'box' }, el('h4', {}, '미신청 팀'), rosterTeams.length
            ? (notYet.length ? el('div', { class: 'sub', style: 'color:var(--coral);font-weight:600' }, notYet.map((t) => t.team).join(', '))
                             : el('div', { class: 'sub' }, '모든 팀이 신청했습니다.'))
            : el('div', { class: 'sub' }, 'teams 탭에 팀 편성이 없습니다.'))
        : el('div', { class: 'box' }, el('h4', {}, '레슨 곡목 입력'),
            el('div', { class: 'big' }, String(yes.filter((a) => a.song).length), el('small', {}, ` / ${yes.length}명`)),
            el('div', { class: 'sub' }, '참여 학생 중 곡목을 적은 인원')));

    const table = list.length ? el('div', { class: 'tbl-wrap' }, el('table', {},
      el('thead', {}, el('tr', {}, header.concat(['']).map((x) => el('th', {}, x)))),
      el('tbody', {}, list.map((a) => {
        const i = all.indexOf(a);
        const att = el('span', { class: 'tag ' + (a.attend === '참여' ? 'ok' : 'no') }, a.attend);
        const time = el('td', { class: 'num' }, fmt(a.updatedAt || a.createdAt), a.updatedAt ? el('div', { style: 'font-size:11px' }, '수정됨') : null);
        const cells = team
          ? [el('td', { class: 'num' }, String(i + 1)), time, el('td', { class: 'nw' }, el('b', {}, a.name)),
             el('td', { class: 'nw' }, a.ensemble), el('td', { class: 'nw' }, a.team || '–'), el('td', {}, a.members),
             el('td', { class: 'nw' }, att), el('td', { class: 'msg' }, a.song || '–')]
          : [el('td', { class: 'num' }, String(i + 1)), time, el('td', { class: 'nw' }, el('b', {}, a.name)),
             el('td', { class: 'nw' }, att), el('td', { class: 'msg' }, a.song || '–')];
        return el('tr', {}, ...cells, el('td', {}, el('button', { class: 'btn sm danger', onclick: () => cancelApp(a) }, '신청 취소')));
      }))))
      : el('div', { class: 'empty' }, q ? '검색 결과가 없습니다.' : '아직 신청이 없습니다.');

    return [tools, summary, table];
  }

  /* ───── 4. 팀 편성 관리 ─────
   * 1회차 편성이 기본. 3·4회차는 바꿀 필요가 있을 때만 전용 편성을 만들고, 팀마다 지정곡을 넣을 수 있음 */
  const memberText = (t) => t.members.map((m) => m.name + (m.part ? `(${m.part})` : '')).join(', ');

  function teamsPane() {
    const base = baseTeamSession();
    const list = board.sessions.filter((s) => s.no === base || s.applyMode === 'team' || (board.teams || []).some((t) => t.session === s.no));
    if (!list.length) return el('div', { class: 'empty' }, '팀 편성을 쓰는 회차가 없습니다.');
    if (!list.some((s) => s.no === teamSession)) teamSession = list[0].no;
    const s = list.find((x) => x.no === teamSession);
    const own = (board.teams || []).filter((t) => t.session === s.no);
    const inherited = !own.length && s.no !== base;
    if (!teamDraft) {
      teamDraft = teamsFor(s.no).map((t) => ({ ensemble: t.ensemble, team: t.team, members: memberText(t),
        fixedSong: t.fixedSong || '', selectedSong: t.selectedSong || '', allowOther: t.allowOther !== false, orig: t.team }));
      teamDirty = false;
    }
    const isWish = s.applyType === 'comment';

    const chips = el('div', { class: 'chips' }, list.map((x) => {
      const ownN = (board.teams || []).filter((t) => t.session === x.no).length;
      return el('button', { class: 'chip', 'aria-pressed': String(x.no === s.no), onclick: () => {
          if (teamDirty && !confirm('저장하지 않은 변경이 있습니다. 다른 회차로 이동할까요?')) return;
          teamSession = x.no; teamDraft = null; render(); } },
        `${x.no}회 ${x.title}`, el('span', { class: 'n' }, x.no === base || ownN ? `${ownN || teamsFor(x.no).length}팀` : '1회 편성'));
    }));

    const state = el('div', { class: 'tstate' },
      el('b', {}, `${s.no}회 ${s.title}`),
      inherited ? el('span', { class: 'tag inh' }, `${base}회차 편성 그대로 사용 중`)
        : s.no === base ? el('span', { class: 'tag' }, '기본 편성') : el('span', { class: 'tag ok' }, `${s.no}회차 전용 편성`),
      el('span', { class: 'sp' }),
      !inherited && s.no !== base ? el('button', { class: 'btn sm danger', onclick: () => resetTeams(s) }, `${base}회차 편성으로 되돌리기`) : null);

    const ensembles = [...new Set((board.teams || []).map((t) => t.ensemble).concat(['피아노 트리오', '피아노 듀오', '바이올린 & 피아노']))];
    const dl = el('datalist', { id: 'ensOpts' }, ensembles.map((x) => el('option', { value: x })));

    const markDirty = () => { if (!teamDirty) { teamDirty = true; const d = document.querySelector('.dirty'); if (d) d.hidden = false; } };
    const inp = (row, key, ph, extra = {}) => {
      const i = el('input', Object.assign({ value: row[key] || '', placeholder: ph }, extra));
      i.addEventListener('input', () => { row[key] = i.value; i.classList.add('changed'); markDirty(); });
      return i;
    };
    // 지정곡: 한 줄에 한 곡 (여러 곡 가능)
    const area = (row, key, ph) => {
      const a = el('textarea', { placeholder: ph, rows: Math.max(2, String(row[key] || '').split('\n').length) });
      a.value = row[key] || '';
      a.addEventListener('input', () => { row[key] = a.value; a.classList.add('changed'); a.rows = Math.max(2, a.value.split('\n').length); markDirty(); });
      return a;
    };
    const chk = (row) => {
      const c = el('input', { type: 'checkbox', checked: row.allowOther !== false, 'aria-label': '지정곡 외 희망곡 선택 허용' });
      c.addEventListener('change', () => { row.allowOther = c.checked; markDirty(); });
      return el('label', { class: 'allow' }, c, '기타 허용');
    };
    const rows = teamDraft.map((row, idx) => el('tr', {},
      el('td', {}, inp(row, 'ensemble', '예: 피아노 듀오', { list: 'ensOpts' })),
      el('td', {}, inp(row, 'team', '예: 듀오 1팀')),
      el('td', {}, inp(row, 'members', '이름(악기), 이름(악기)')),
      isWish ? el('td', {}, inp(row, 'selectedSong', '10/5 곡 선정 후 입력')) : null,
      el('td', {}, chk(row)),
      el('td', {}, el('button', { class: 'btn sm danger', title: '이 팀 빼기', onclick: () => {
        teamDraft.splice(idx, 1); teamDirty = true; render(); } }, '빼기'))));

    const table = el('div', { class: 'tbl-wrap' }, el('table', { class: 'tedit ' + (isWish ? 'wish' : 'nosong') },
      el('thead', {}, el('tr', {}, (isWish ? ['편성', '팀 이름', '구성원', '확정곡', '희망곡 선택', ''] : ['편성', '팀 이름', '구성원', '희망곡 선택', '']).map((x) => el('th', {}, x)))),
      el('tbody', {}, rows)), dl);

    const bar = el('div', { class: 'editbar' },
      el('button', { class: 'btn', onclick: () => { teamDraft.push({ ensemble: '', team: '', members: '', fixedSong: '', selectedSong: '', allowOther: true }); teamDirty = true; render();
        requestAnimationFrame(() => { const r = document.querySelectorAll('table.tedit tbody tr'); r[r.length - 1]?.querySelector('input')?.focus(); }); } }, '+ 팀 추가'),
      el('span', { class: 'dirty', hidden: !teamDirty }, '저장하지 않은 변경이 있어요'),
      el('span', { class: 'sp' }),
      teamDirty ? el('button', { class: 'btn', onclick: () => { teamDraft = null; render(); } }, '변경 취소') : null,
      el('button', { class: 'btn primary', onclick: () => saveTeams(s, inherited) }, inherited ? `${s.no}회차 전용 편성으로 저장` : '저장'));

    const notes = el('div', {},
      inherited ? el('p', { class: 'note' }, `지금은 ${base}회차 편성을 그대로 보여주고 있어요. 구성을 바꾸거나 지정곡을 넣고 저장하면 ${s.no}회차 전용 편성이 만들어지고, ${base}회차 편성은 그대로 남습니다.`) : null,
      isWish ? el('p', { class: 'note' }, '1회차에서 팀 이름을 바꾸면, 이미 입력된 희망곡과의 연결이 끊어져요. 확정곡을 넣으면 학생 화면의 팀 카드에 확정곡으로 표시됩니다.')
             : el('p', { class: 'note' }, '지정곡은 "지정곡 관리" 탭에서 곡을 기준으로 회차·편성·팀을 정해 넣어요.'),
      el('p', { class: 'note' }, '"희망곡 선택"을 체크한 팀은 신청 화면의 지정곡 드롭다운에 "기타" 항목이 보여서, 지정곡 외에 팀원이 원하는 곡을 직접 입력할 수 있어요. 체크를 풀면 지정곡 중에서만 고를 수 있습니다.'),
      el('p', { class: 'note' }, '구성원은 쉼표로 구분하고, 악기는 괄호 안에 적어 주세요. 예: 김OO(피아노), 이OO(바이올린)'));

    return [el('div', { class: 'tools' }, chips), state, table, bar, notes];
  }

  async function saveTeams(s, inherited) {
    const list = teamDraft.filter((r) => r.team.trim() || r.members.trim() || r.ensemble.trim());
    if (inherited && !teamDirty && !confirm(`변경 없이 ${s.no}회차 전용 편성으로 저장할까요?`)) return;
    try {
      board.teams = await api('adminSaveTeams', token, s.no, list.map((r) => ({
        ensemble: r.ensemble, team: r.team, members: r.members, fixedSong: r.fixedSong, selectedSong: r.selectedSong, allowOther: r.allowOther !== false })));
      teamDraft = null; teamDirty = false; render(); toast(`${s.no}회차 팀 편성을 저장했습니다.`);
    } catch (e) { fail(e); }
  }

  async function resetTeams(s) {
    const base = baseTeamSession();
    if (!confirm(`${s.no}회차 전용 편성을 지우고 ${base}회차 편성을 그대로 쓸까요? (이 회차에 넣은 지정곡도 함께 지워집니다)`)) return;
    try { board.teams = await api('adminResetTeams', token, s.no); teamDraft = null; teamDirty = false; render(); toast(`${base}회차 편성으로 되돌렸습니다.`); }
    catch (e) { fail(e); }
  }

  window.addEventListener('beforeunload', (e) => { if (teamDirty || schedDirty || songDirty) { e.preventDefault(); e.returnValue = ''; } });

  /* ───── 6. 지정곡 관리 ─────
   * 곡을 기준으로 회차(여러 개 가능) · 편성(전체 또는 하나) · 팀(선택 안 하면 그 편성 전체)을 정함 */
  const teamSessionsForSongs = () => {
    const base = baseTeamSession();
    return board.sessions.filter((s) => s.no === base || s.applyMode === 'team' || (board.teams || []).some((t) => t.session === s.no));
  };

  function songEntriesFromBoard() {
    const map = new Map();
    (board.songs || []).filter((x) => x.song).forEach((x) => {
      const teams = (x.teams || []).slice().sort();
      const detail = /^지정곡$/.test(x.detail) ? '' : x.detail;
      const key = [x.song, detail, x.ensemble, teams.join('|')].join('¶');
      if (!map.has(key)) map.set(key, { song: x.song, detail, ensemble: x.ensemble, teams, sessions: [] });
      map.get(key).sessions.push(x.session);
    });
    return [...map.values()];
  }

  function songsPane() {
    const sessions = teamSessionsForSongs();
    if (!songDraft) { songDraft = songEntriesFromBoard(); songDirty = false; }
    const markDirty = (card) => { songDirty = true; if (card) card.classList.add('changed'); const d = document.querySelector('.songbar .dirty'); if (d) d.hidden = false; };
    const allEns = [...new Set((board.teams || []).map((t) => t.ensemble))];

    const cards = songDraft.map((e) => {
      const card = el('div', { class: 'sc' });
      const scope = el('div', { class: 'scope' });
      const teamBox = el('div', { class: 'boxes' });
      const describe = () => {
        const ss = e.sessions.slice().sort((a, b) => a - b).map((n) => `${n}회`).join(', ') || '회차 미선택';
        const who = e.teams.length ? e.teams.join(', ') : (e.ensemble ? `${e.ensemble} 전체 팀` : '모든 팀');
        scope.textContent = `${ss} · ${who}에 지정곡으로 적용`;
      };
      const drawTeams = () => {
        const cand = [];
        e.sessions.forEach((no) => teamsFor(no).forEach((t) => {
          if ((!e.ensemble || t.ensemble.replace(/\s/g, '') === e.ensemble.replace(/\s/g, '')) && !cand.includes(t.team)) cand.push(t.team);
        }));
        e.teams = e.teams.filter((x) => cand.includes(x));
        teamBox.replaceChildren(...(cand.length ? cand.map((name) => {
          const c = el('input', { type: 'checkbox', checked: e.teams.includes(name) });
          c.addEventListener('change', () => {
            e.teams = c.checked ? e.teams.concat(name) : e.teams.filter((x) => x !== name);
            markDirty(card); describe(); });
          return el('label', {}, c, name);
        }) : [el('span', { style: 'font-weight:400' }, '회차를 먼저 고르세요')]));
        describe();
      };

      const songIn = el('input', { value: e.song, placeholder: '예: F. Poulenc, Sonata for 1Piano 4Hands', maxlength: 300 });
      songIn.addEventListener('input', () => { e.song = songIn.value; markDirty(card); });
      const detailIn = el('input', { value: e.detail, placeholder: '선택 안내 (선택) 예: 中 선택 2', maxlength: 300 });
      detailIn.addEventListener('input', () => { e.detail = detailIn.value; markDirty(card); });

      const sessBox = el('div', { class: 'boxes' }, sessions.map((s) => {
        const c = el('input', { type: 'checkbox', checked: e.sessions.includes(s.no) });
        c.addEventListener('change', () => {
          e.sessions = c.checked ? e.sessions.concat(s.no) : e.sessions.filter((x) => x !== s.no);
          markDirty(card); drawTeams(); });
        return el('label', {}, c, `${s.no}회`);
      }));
      const ensSel = el('select', {}, el('option', { value: '' }, '모든 편성'),
        allEns.concat(e.ensemble && !allEns.includes(e.ensemble) ? [e.ensemble] : []).map((x) => el('option', { value: x, selected: x === e.ensemble }, x)));
      ensSel.addEventListener('change', () => { e.ensemble = ensSel.value; markDirty(card); drawTeams(); });

      card.append(
        el('div', { class: 'sc-row1' },
          el('label', { class: 'fl' }, '곡명', songIn),
          el('label', { class: 'fl' }, '선택 안내', detailIn),
          el('button', { class: 'btn sm danger', onclick: () => { songDraft.splice(songDraft.indexOf(e), 1); songDirty = true; render(); } }, '삭제')),
        el('div', { class: 'sc-row2' },
          el('div', { class: 'grp' }, '회차', sessBox),
          el('label', { class: 'fl' }, '편성', ensSel),
          el('div', { class: 'grp' }, el('span', {}, '팀 ', el('small', { style: 'font-weight:400' }, '(선택하지 않으면 편성 전체)')), teamBox)),
        scope);
      drawTeams();
      return card;
    });

    const bar = el('div', { class: 'editbar songbar' },
      el('button', { class: 'btn', onclick: () => {
        songDraft.push({ song: '', detail: '', ensemble: '', teams: [], sessions: sessions.length ? [sessions[sessions.length - 1].no] : [] });
        songDirty = true; render();
        requestAnimationFrame(() => { const c = document.querySelectorAll('.sc'); c[c.length - 1]?.querySelector('input')?.focus(); }); } }, '+ 지정곡 추가'),
      el('span', { class: 'dirty', hidden: !songDirty }, '저장하지 않은 변경이 있어요'),
      el('span', { class: 'sp' }),
      songDirty ? el('button', { class: 'btn', onclick: () => { songDraft = null; render(); } }, '변경 취소') : null,
      el('button', { class: 'btn primary', onclick: saveSongs }, '지정곡 저장'));

    // 팀별로 어떻게 적용되는지 미리보기 (저장된 값 기준)
    if (!songView || !sessions.some((s) => s.no === songView)) songView = sessions.length ? sessions[sessions.length - 1].no : null;
    const vs = sessions.find((s) => s.no === songView);
    const preview = vs ? el('div', { class: 'preview' },
      el('h4', {}, '팀별 적용 결과 (저장된 기준)',
        el('span', { class: 'chips' }, sessions.map((s) => el('button', { class: 'chip', 'aria-pressed': String(s.no === vs.no), onclick: () => { songView = s.no; render(); } }, `${s.no}회`)))),
      el('div', { class: 'tbl-wrap' }, el('table', {},
        el('thead', {}, el('tr', {}, ['편성', '팀', '지정곡', '기타 곡'].map((x) => el('th', {}, x)))),
        el('tbody', {}, teamsFor(vs.no).map((t) => {
          const list = assignedSongs(vs.no, t);
          return el('tr', {}, el('td', { class: 'nw' }, t.ensemble), el('td', { class: 'nw' }, el('b', {}, t.team)),
            el('td', {}, list.length ? el('ul', {}, list.map((x) => el('li', {}, x))) : el('span', { class: 'none' }, '없음 (직접 입력)')),
            el('td', { class: 'nw' }, el('span', { class: 'tag ' + (t.allowOther !== false ? 'ok' : 'no') }, t.allowOther !== false ? '허용' : '안 됨')));
        }))))) : null;

    return [
      el('p', { class: 'note', style: 'margin:0 0 14px' }, '곡을 먼저 적고, 그 곡을 지정곡으로 쓸 회차·편성·팀을 고르세요. 팀을 고르지 않으면 선택한 편성의 모든 팀에 적용되고, 편성도 "모든 편성"이면 그 회차의 모든 팀에 적용됩니다.'),
      el('div', { class: 'songcards' }, cards.length ? cards : el('div', { class: 'empty' }, '등록된 지정곡이 없습니다.')),
      bar, preview];
  }

  // 저장된 songs 기준으로 팀에 배정된 곡 목록
  function assignedSongs(no, t) {
    const out = String(t.fixedSong || '').split(/\n/).map((x) => x.trim()).filter(Boolean);
    (board.songs || []).filter((x) => x.session === no && x.song
        && (!x.ensemble || x.ensemble.replace(/\s/g, '') === t.ensemble.replace(/\s/g, ''))
        && (!(x.teams || []).length || x.teams.includes(t.team)))
      .forEach((x) => { if (!out.includes(x.song)) out.push(x.song); });
    return out;
  }

  async function saveSongs() {
    const list = songDraft.filter((e) => e.song.trim());
    if (list.length < songDraft.length && !confirm('곡명이 비어 있는 항목은 빼고 저장할까요?')) return;
    try {
      board.songs = await api('adminSaveSongs', token, list.map((e) => ({ song: e.song, detail: e.detail, ensemble: e.ensemble, teams: e.teams, sessions: e.sessions })));
      songDraft = null; songDirty = false; render(); toast('지정곡을 저장했습니다.');
    } catch (e) { fail(e); }
  }

  /* ───── 5. 일정 관리 ─────
   * 회차 정보(sessions 탭)와 날짜 일정(milestones 탭)을 한 화면에서 고침.
   * 날짜 일정은 화면 표시와 실제 운영(신청 가능 기간·진행일)에 함께 쓰임 */
  const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const mdw = (d) => { if (!d) return ''; const t = new Date(d + 'T00:00:00'); return `${t.getMonth() + 1}/${t.getDate()}(${WEEK[t.getDay()]})`; };
  const MODE_OPTS = [['comment', '희망곡 작성 (팀 카드에서 입력)'], ['solo', '개인 신청'], ['team', '팀 신청 (팀원 중 한 명)'], ['', '신청 없음']];
  const TYPE_OPTS = [['apply', '신청 기간'], ['notice', '공지'], ['event', '멘토링 당일']];

  async function loadSched() {
    try {
      const r = await api('adminGetSchedule', token);
      sched = {
        sessions: r.sessions.map((s) => Object.assign({}, s, { applyType: s.applyType === 'form' ? (/실내악/.test(s.title) ? 'team' : 'solo') : s.applyType })),
        milestones: r.milestones.map((m) => Object.assign({}, m)),
      };
      schedDirty = false;
      render();
    } catch (e) { fail(e); }
  }

  function schedPane() {
    if (!sched) { loadSched(); return el('div', { class: 'loading' }, '일정을 불러오는 중…'); }
    const dirty = () => { if (!schedDirty) { schedDirty = true; const d = document.querySelector('.sticky-save .dirty'); if (d) d.hidden = false; } };
    const bind = (obj, key, node, after) => {
      node.addEventListener(node.tagName === 'SELECT' || node.type === 'date' ? 'change' : 'input', () => {
        obj[key] = node.value; node.classList.add('changed'); dirty(); if (after) after(); });
      return node;
    };
    const field = (label, obj, key, opts = {}) => {
      const n = opts.select
        ? el('select', {}, opts.select.map(([v, t]) => el('option', { value: v, selected: String(obj[key] || '') === v }, t)))
        : opts.area ? el('textarea', { maxlength: 500 }) : el('input', { value: obj[key] || '', placeholder: opts.ph || '', maxlength: 80 });
      if (opts.area) n.value = obj[key] || '';
      return el('label', { class: 'fl' + (opts.cls ? ' ' + opts.cls : '') }, label, bind(obj, key, n, opts.after));
    };

    const sumText = (s) => {
      const mine = sched.milestones.filter((m) => m.session === s.no);
      const ap = mine.find((m) => m.type === 'apply'), ev = mine.find((m) => m.type === 'event');
      return [ap ? `신청 ${mdw(ap.date)}~${mdw(ap.endDate)}` : null, ev ? `진행 ${mdw(ev.date)}` : '진행일 없음'].filter(Boolean).join(' · ');
    };
    const cards = sched.sessions.map((s) => {
      const ms = sched.milestones.filter((m) => m.session === s.no).sort((a, b) => (a.date > b.date ? 1 : -1));
      const sumEl = el('span', { class: 'sum' }, sumText(s));
      const upd = () => { sumEl.textContent = sumText(s); };

      const rows = ms.map((m) => {
        const dateIn = el('input', { type: 'date', value: m.date || '' });
        const endIn = el('input', { type: 'date', value: m.endDate || '', disabled: m.type === 'event' });
        const typeSel = el('select', {}, TYPE_OPTS.map(([v, t]) => el('option', { value: v, selected: m.type === v }, t)));
        const labelIn = el('input', { value: m.label || '', maxlength: 60, placeholder: '예: 전공실기 멘토링 신청' });
        // 입력 중 화면을 다시 그리지 않고 제자리에서만 갱신 (날짜를 타이핑하는 도중 포커스가 빠지지 않게)
        const tr = el('tr', { class: m.type === 'event' ? 'ev' : '' });
        bind(m, 'type', typeSel, () => {
          endIn.disabled = m.type === 'event';
          if (m.type === 'event') { m.endDate = ''; endIn.value = ''; }
          tr.className = m.type === 'event' ? 'ev' : ''; upd(); });
        bind(m, 'date', dateIn, upd);
        bind(m, 'endDate', endIn, upd);
        bind(m, 'label', labelIn);
        tr.append(
          el('td', {}, typeSel), el('td', {}, dateIn), el('td', {}, endIn), el('td', {}, labelIn),
          el('td', {}, el('button', { class: 'btn sm danger', onclick: () => {
            sched.milestones.splice(sched.milestones.indexOf(m), 1); schedDirty = true; render(); } }, '빼기')));
        return tr;
      });

      return el('section', { class: 'scard' },
        el('div', { class: 'scard-top' }, el('span', { class: 'rn' }, ROMAN[s.no] || s.no), el('b', {}, `${s.no}회 ${s.title}`), sumEl),
        el('div', { class: 'scard-body' },
          el('div', { class: 'sgrid' },
            field('제목', s, 'title', { after: () => {} }),
            field('영문 이름', s, 'en', { ph: '예: Ensemble Mentoring' }),
            field('시간', s, 'time', { ph: '예: 오후' }),
            field('장소', s, 'place', { ph: '예: 한예종 서초동캠퍼스' })),
          el('div', { class: 'sgrid2' },
            field('신청 방식', s, 'applyType', { select: MODE_OPTS }),
            field('신청 버튼 문구', s, 'applyLabel', { ph: '예: 멘토링 신청' }),
            field('소개 (선택)', s, 'summary', { area: true })),
          el('p', { class: 'ms-title' }, '날짜 일정 (오선 일정표 · 진행 순서 · 신청 가능 기간에 모두 반영)'),
          el('div', { class: 'tbl-wrap' }, el('table', { class: 'ms' },
            el('thead', {}, el('tr', {}, ['구분', '날짜 (시작)', '마감일', '내용', ''].map((x) => el('th', {}, x)))),
            el('tbody', {}, rows.length ? rows : el('tr', {}, el('td', { colspan: 5, style: 'color:var(--muted)' }, '일정이 없습니다.'))))),
          el('div', {}, el('button', { class: 'btn sm', onclick: () => {
            sched.milestones.push({ session: s.no, date: '', endDate: '', label: '', type: 'notice' }); schedDirty = true; render(); } }, '+ 일정 추가'))));
    });

    const save = el('div', { class: 'sticky-save' },
      el('span', { class: 'dirty', hidden: !schedDirty }, '저장하지 않은 변경이 있어요'),
      el('span', { class: 'sp' }),
      el('button', { class: 'btn', onclick: () => { if (!schedDirty || confirm('변경한 내용을 버리고 다시 불러올까요?')) { sched = null; schedDirty = false; render(); } } }, '다시 불러오기'),
      el('button', { class: 'btn primary', onclick: saveSched }, '일정 저장'));

    const note = el('p', { class: 'note', style: 'margin:0 0 14px' },
      '각 회차에는 멘토링 당일이 하나 있어야 하고, 신청 기간은 하나까지 둘 수 있어요. 저장하면 게시판의 오선 일정표, 카드 상태, 신청 가능 기간이 바로 바뀝니다.');
    return [note, el('div', { class: 'sched' }, cards), save];
  }

  async function saveSched() {
    const btn = document.querySelector('.sticky-save .btn.primary');
    btn.disabled = true;
    try {
      await api('adminSaveSchedule', token,
        sched.sessions.map((s) => ({ no: s.no, title: s.title, en: s.en, time: s.time, place: s.place, applyType: s.applyType, applyLabel: s.applyLabel, summary: s.summary })),
        sched.milestones.map((m) => ({ session: m.session, date: m.date, endDate: m.endDate, label: m.label, type: m.type })));
      schedDirty = false;
      toast('일정을 저장했습니다.');
      const keepTab = tab;
      await loadAll();
      tab = keepTab; render();
    } catch (e) { fail(e); btn.disabled = false; }
  }

  async function cancelApp(a) {
    if (!confirm(`${a.team || a.name}의 신청을 취소 처리할까요? (시트에는 기록이 남습니다)`)) return;
    try { await api('adminCancelApplication', token, a.id); apps = apps.filter((x) => x.id !== a.id); render(); toast('취소 처리했습니다.'); }
    catch (e) { fail(e); }
  }

  showLogin();
</script>
</body>
</html>
